name: PostgreSQL lifecycle

# Full DB regression is local by default. Maintainers explicitly request hosted
# reproduction for release qualification or environment-specific investigation.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: postgres-hosted-${{ inputs.revision }}
  cancel-in-progress: true

jobs:
  kl-002-database:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TESTED_COMMIT: ${{ inputs.revision }}
    steps:
      - name: Validate immutable revision
        shell: bash
        run: '[[ "$TESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv sync --locked
      - name: Full database regression and lifecycle evidence
        run: >-
          uv run python tools/harness/db_ci.py run
          --revision "$TESTED_COMMIT" --environment github-hosted
          --evidence-dir "$RUNNER_TEMP/db-evidence"
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-evidence-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/db-evidence
          if-no-files-found: error
          retention-days: 14
