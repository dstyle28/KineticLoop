decisions:
  - Use PostgreSQL FOR SHARE / FOR UPDATE on the singleton S51 system row as the logical shared/exclusive gate.
  - Keep the authoritative transaction at READ COMMITTED and perform every eligibility read in statements after gate acquisition.
  - Represent stale registry authority as current revision below a caller-required minimum; unrelated higher revisions do not invalidate authorization.
  - Require callers to supply the complete bounded immutable artifact closure and reject missing registered dependencies.
  - Treat successful T2-GLOBAL commit as authority; effective_at remains audit metadata only.
  - Keep STOP on a separate S01-first entrypoint with no S51 read or lock.
  - Read authoritative PostgreSQL time only after S51 and S01 are held; do not accept caller-captured time for authorization or artifact validity.
  - Issue the authoritative clock read in a separate statement after the S01 locking statement returns, so time cannot be captured before an S01 lock wait.
  - Seed and reset fixture eligibility windows from PostgreSQL clock_timestamp() so required success paths do not expire with wall-clock time.
  - Derive the future-effective revocation oracle from PostgreSQL time and assert it remains later than recorded_at.
  - Prove post-S01 time sampling by seeding a future expiry before the worker blocks, waiting for PostgreSQL time to pass it, then releasing S01 without changing S49.
  - Exercise every shared-gated command against unknown registration, incomplete declared dependency closure, undefined validity, and future valid_from before mutation.
  - Inject PostgreSQL OperationalError at the shared-gate acquisition boundary through each production command owner and require REGISTRY_UNAVAILABLE with zero mutation.
  - Require an idle connection and own the top-level transaction through commit so no helper can return while an outer transaction retains S51 or reverses lock order.
  - Propagate mutation and commit OperationalError as unknown outcomes; only pre-mutation registry failures become deterministic denials.
  - Bind effective_at and reason_code to the strict command's canonical revocation_payload_hash.
  - Prove both shared-first and revoke-first serialization orders, concurrent same-key replay, different-hash conflict, and commit-success/ACK-loss reconciliation in real PostgreSQL.
  - Merge current master before final verification so checks and reviews bind to the actual integration candidate.
known_limitations:
  - KL-016 intentionally uses a task-local minimal PostgreSQL fixture and adds no migration; concrete production DDL remains owned by its downstream schema task.
  - Gate tail-latency and writer-priority load testing remain outside this task's functional concurrency contract.
