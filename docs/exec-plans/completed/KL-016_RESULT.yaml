summary: >-
  Implemented the frozen SafetyRegistry shared/exclusive gate as a PostgreSQL lock API:
  T3/T6/T7 acquire shared S51 before S01 and re-read bounded current artifact,
  transitive-dependency, validity, revocation, and command-appropriate authorization
  eligibility before mutation. T2-GLOBAL RevokeArtifact acquires exclusive S51 without
  S01 and atomically appends revocation, advances registry revision, and writes its
  management receipt, audit event, and outbox. Real PostgreSQL interleavings prove
  ordering, fail-closed behavior, commit linearization, idempotency, and STOP independence.
