decisions:
  - Model forbidden live shadow targets as explicit null wire fields so construction and deserialization fail closed if any S38, S42, S45, or live PlanningIntent-success target is supplied.
  - Bind TEST_ONLY to the merged KL-007 RoleIdentity TEST role and its derived RUN_TEST_SIMULATION capability; caller-asserted capabilities are never accepted.
  - Encode isolated non-production subject, policy, and environment boundaries plus mandatory T6/T7 command-owner guards in the strict wire contract.
  - Keep all related product obligations NOT_RUN because contract-level task PASS is not PU, DC, WF, or E2E requirement PASS.
known_limitations:
  - This task intentionally provides no storage, migration, command owner, transaction implementation, live authorization, or integration/E2E test.
  - Authentication and trusted role assignment remain outside this typed contract and must be enforced before a later command owner consumes it.
follow_up_tasks:
  - Implement later isolated evaluation persistence and guarded T6/T7 command-owner paths only in their assigned task packets.
  - Obtain fresh independent DB_CONCURRENCY, GENERAL, and PROTOCOL reviews against the exact implementation/result head before merge.
