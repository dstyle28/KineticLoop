decisions:
- Protected base, normally merged prerequisite ancestry/results/reviews, authority hashes and M2 PASS verified before
  execution; entry-audit.json is the durable entry witness.
- Only three declared implementation paths plus task-owned result/evidence/review records change. Production sources,
  grants, migrations, lifecycle, shared fixtures, CI and frozen baselines are unchanged.
- Every lifecycle and nested bootstrap/cleanup route validates exact KL028 boundary label, runtime HEAD and resolved-root
  digest before runner calls. Explicit owned URLs, verified current_database/migration head and finite connection/SQL/lock/idle
  deadlines protect each connection. Every DB case records empty exact-label cleanup inventories.
- Merged owners produce every tested seal, projection/build, manifest, full TEST snapshot/F/D/N/resolution/validation,
  bundle/issuance and execution binding. RegisterArtifact produces A/B/C transitive graph; RevokeArtifact performs
  actual trusted management writes. No target output seeds, terminal reopening or timestamp overwrite substitutes.
- Race evidence observes actual pg_blocking_pids and trusted time using bounded barriers after real owner writes
  and before commit, in both serial orders. S51 precedes S01. Exact guard causes and complete user/global before/after
  history establish denial and rollback zero effects.
- Owner-issued validity certificates are checked against actual source IDs, revisions and windows, exact server
  minimum, deterministic dependency order/hash/method and materialized S49 closure. Client extension cannot lengthen
  authority; half-open equality is separately PU.
- B04 existing Reauthorize guard probe intentionally aborts after the actual gate and is never labeled full reauthorization
  PASS. B14 registry query fault/shared-gate timeout plus independent S01 STOP is DC support only, never WF/E2E
  PASS.
- Exploratory logs preserve task-local assertion/signature corrections and are explicitly non-final evidence. All
  final task checks ran on the committed implementation tested SHA; result/evidence append precedes fresh independent
  GENERAL/PROTOCOL/DB_CONCURRENCY reviews. Only own REVIEW_RECORD_ONLY suffix may follow.
known_limitations:
- Twelve exact deferred obligations remain NOT_RUN with owner gaps recorded individually. Task PASS is separate
  from review PASS, requirement/product PASS and MERGED.
- No public API/rendering E2E, pure registry commit-state evaluator, independent worker STOP lane/fault infrastructure
  or complete full TEST Reauthorize owner is supplied by this tests-only task.
- Inherited KL-077 DEMAND_FEATURE descriptive proposal_id metadata follow-up remains separate; actual D-to-F and
  N closure authority is unchanged. No source repair or historical certificate rewrite is included.
- Production auto-activation remains disabled; real-data shadow remains non-executable; planned values never populate
  actual execution.
- Normal merge remains conditional on independent reviews and unchanged final-head hosted quality, merge-gate and
  PostgreSQL checks; integration is UNMERGED here.
