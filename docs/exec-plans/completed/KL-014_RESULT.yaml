decisions:
  - Encode every atomic or preparation boundary as a required Literal field so callers cannot relabel a preparation command as T1, T2, T3, T5, or T6.
  - Preserve T2 as the three distinct frozen boundaries T2-IN, T2-SEAL, and T2-GLOBAL; keep factset building and artifact registration outside them.
  - Bind subject commands to exactly one subject and a role-derived trusted capability; bind registry commands to the explicit global safety-registry scope with no fabricated subject.
  - Admit isolated TEST_ONLY scope only to CommitBundle, Reauthorize, StartSession, ResumeSession, and ContinueSession, while preserving direct-write denial and the real T6/T7 owner guard.
  - Keep IssueAuthorization, InvalidateAuthorization, RecordSnapshot, AdvanceAttempt, and CancelUndispatched out of the public model registry.
  - Make historical eligibility explicit on T6/T7 results and reject a replayed PermitDispatch result that purports to grant a second provider send.
  - Require every production subject command's authenticated actor identity to equal its subject_id; no implicit cross-subject delegation is admitted.
  - Represent the immutable input revision frontier as explicit SHA-256 `*_input_frontier_hash` values; never treat it as a protocol counter.
  - Require TEST_ONLY T6 scope policy_id to equal the CommitBundle or Reauthorize policy_id so isolated policy scope cannot be widened.
  - Parse JSON strings and ordinary JSON-decoded dictionaries through the same strict JSON-mode validators so wire enum strings behave identically.
  - Reuse the merged three-field RoleIdentity wire shape and derive capability from role; reject caller-asserted capability, trust, and authentication provenance.
  - Bind worker-produced T5/T6 preparation records to intent, attempt, request revision, lease owner/fence/expiry, and expected RUNNING status, with typed immutable domain bases.
  - Return the committed owner, fence token, and lease expiry from acquire/renew success results for downstream fenced writes.
known_limitations:
  - These are typed immutable wire contracts only; they do not implement command-owner authorization, receipts, persistence, PostgreSQL transactions, locking, registry gates, or external dispatch.
  - Command acceptance remains responsible for proving that RoleIdentity was assigned at the authenticated service boundary; a Pydantic value does not itself authenticate a caller.
follow_up_tasks:
  - Later command-owner and repository tasks must consume these contracts without widening their serialized transaction boundaries or bypassing frozen guards.
  - Obtain fresh GENERAL, PROTOCOL, DB_CONCURRENCY, and SECURITY_DATA_BOUNDARY review evidence bound to the exact PR head SHA before merge.
