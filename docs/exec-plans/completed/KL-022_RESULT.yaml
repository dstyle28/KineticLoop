summary: >-
  Added a reusable pure Authorization validity/executability evaluator and wired
  it into the existing T6 and T7 repository owners. T6 now persists one
  deterministic finite certificate whose end is the exact minimum of requested,
  manifest, resolution, admission-freshness, validation, projection, transitive
  artifact, policy TTL, request deadline and calendar bounds, using each persisted
  dependency's authoritative start; missing, future-effective, or invalid basis
  denies atomically, and approved TIMELESS artifacts contribute no artificial end.
  T7 rereads exact subject, content, scope, epoch, targeted S43, applicable
  S18/S17, policy, session/head, dependency and database-time facts under the
  existing S51-to-S01 gate, returning only a non-bearer current observation.
  Isolated PostgreSQL interleavings prove committed transitive revocation is seen
  after lock wait while unrelated revocation does not deny. The TEST-subject E2E
  uses canonical trusted-admin registration, an isolated policy/environment and
  TEST_ONLY scope, and stops without writing an execution binding.
