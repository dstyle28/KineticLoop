decisions:
  - Public provider configuration names credential requirements but never stores credential values; callers must select an explicit SecretSource.
  - SecretValue is deliberately opaque to generic JSON, dataclass, mapping, repr, and string diagnostic paths; reveal is an explicit in-process operation.
  - Secret-bearing wrapper/source objects also reject pickle serialization so generic object serialization cannot recover plaintext.
  - RedactedDiagnostic is presentation-only and has no Evidence Admission, command, role, capability, approval, or authorization behavior.
  - DatabaseConnection.url remains the explicit in-process tooling surface while all default JSON/string/repr and CLI diagnostics use redacted fields.
  - Synthetic fixture validation fails closed on missing provenance, production markers, undocumented fields, or non-sentinel credential/health values.
  - Synthetic fixture/provenance identities and provider-specific credential/health profiles must match exactly.
known_limitations:
  - No production secret-store vendor or provider adapter is introduced; later integrations must supply an explicit SecretSource implementation.
  - No product requirement PASS is claimed by this task-level security/configuration evidence.
follow_up_tasks:
  - Provider adapter tasks may reuse these credential and diagnostic boundaries without bypassing Evidence Admission.
