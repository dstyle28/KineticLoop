summary: >-
  Added canonical provider and stream identities, an explicit trusted server-side
  provider/subject/source binding, and a strict immutable S09 EvidenceEnvelope.
  Provider-owned observations cannot choose subject, source connection, trust,
  command authority, or known_at; the ReceiveEvidence handoff fails every binding
  mismatch with one non-enumerating SUBJECT_MISMATCH. An explicit credential guard
  rejects raw, encoded, nested, URL, exception, and adapter-failure credential paths,
  while the common adapter interface remains hermetic and can emit only evidence.
  Transport health remains separate from coverage, and every committed provider
  fixture passes the hardened KL-009 synthetic provenance and sentinel guard.
