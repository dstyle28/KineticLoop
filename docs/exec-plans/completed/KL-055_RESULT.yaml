decisions:
  - Keep ProviderId and StreamId as distinct bounded canonical tokens and preserve exact provider/stream identity in every envelope.
  - Attach subject, source connection, source/trust classes, and adapter version only from an explicit trusted server binding, never provider payload fields.
  - Require lineage root provider identity to equal the trusted binding and envelope provider identity.
  - Require exactly one provider revision or stable observation key and exactly one canonical payload hash or controlled blob reference.
  - Require the selected provider revision or stable observation key to be a nonblank exact string in both raw observations and closed S09 envelopes.
  - Require controlled blob references to include a bounded, whitespace-free object identity after the blob scheme in both raw observations and closed envelopes.
  - Seal the trusted server clock into ProviderExecutionContext; require that context at the exported ReceiveEvidence handoff; return a newly validated envelope whose known_at is assigned there; and keep observed_at/effective_at as separate provider evidence times.
  - Fix command_authority to NONE and validate adapter output at runtime as an exact immutable tuple of EvidenceEnvelope values.
  - Reuse the merged KL-009 explicit secret source and redaction boundary, with a sealed guard that scans mapping keys and values and rejects registered and credential-shaped raw or bounded percent-decoded content before hashing or serialization.
  - Keep connection lifecycle and evidence coverage as independent fields; validate raw status diagnostics through the credential guard and expose only a one-way watermark hash plus bounded canonical error code.
  - Validate every committed provider fixture through the hardened KL-009 synthetic fixture validator rather than introducing a weaker parallel validator.
known_limitations:
  - This task defines the common provider contract only; provider-specific HTTP clients, polling, correction semantics, exercise mapping, persistence, and Evidence Admission remain in downstream tasks.
  - Controlled blob storage and the T1 persistence command owner are not implemented here; this boundary only validates their identifiers and handoff binding.
  - No product requirement PASS or production auto-activation is claimed.
follow_up_tasks:
  - Run fresh SHA-bound GENERAL, PROTOCOL, and SECURITY_DATA_BOUNDARY independent reviews on the final reviewable head.
  - Implement provider-specific Hevy behavior and acceptance evidence in the downstream packet without bypassing this EvidenceEnvelope boundary.
