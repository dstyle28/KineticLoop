summary: >-
  Added canonical provider and stream identities, an explicit trusted server-side
  provider/subject/source binding, and a strict immutable S09 EvidenceEnvelope.
  Provider-owned observations cannot choose subject, source connection, trust,
  lineage root, command authority, or known_at; the exported T1 receive handoff
  requires the trusted execution context and returns a newly validated envelope
  timestamped from its sealed server clock, while every binding mismatch fails with
  one non-enumerating SUBJECT_MISMATCH. Envelope source revision/observation identity
  is also required to be nonblank through both adapter-output and T1 handoffs, and
  controlled blob references require a bounded nonblank object identity. An explicit credential guard
  rejects raw, encoded, nested, mapping-key, URL, exception, and adapter-failure credential paths,
  while the common adapter interface remains hermetic and can emit only evidence.
  Transport health remains separate from coverage; status diagnostics retain only
  a credential-checked watermark hash and canonical error code. Every committed
  provider fixture passes the hardened KL-009 synthetic provenance and sentinel guard.
