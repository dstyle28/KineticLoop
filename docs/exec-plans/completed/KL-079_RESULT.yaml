decisions:
- Persisted exact full TEST policy selects a separate closed internal request profile; callers cannot
  downgrade completeness to legacy.
- Full TRAINING and NUTRITION S36 identities/hash bases bind exact F/D/N and admitted sealed source closure.
  N is a fixture TARGET with fixed units, never ACTUAL or clinical evidence.
- Retain one S37 singular TRAINING resolution FK plus explicit ordered owner-verified action_bindings;
  the additional NUTRITION JSON reference is verified by ID/hash without inventing a FK.
- Extend only the full-profile COMMIT_READY branch in transactions._progress_sources; preserve six source
  keys, existing stages/owners/wires and frozen locks.
- Register the new full runtime through the existing trusted SafetyRegistry RegisterArtifact owner with
  exact bounded immutable dependencies; consume its canonical registration payload.
- Prove distinct admitted-source/runtime limiting expiry at actual full validation and COMMIT_READY, and
  independently exercise consumer manifest/attempt/fence/takeover/post-lock lease denials. Prior CHANGES_REQUIRED
  reviews are retained in commit history; all final packet checks are rerun.
- Derive every local reset/bootstrap/connection/cleanup from exact task/HEAD/resolved-root namespace;
  unchanged legacy DB suites are reserved for hosted CI.
known_limitations:
- KL079 stops at non-executable COMMIT_READY. KL077 owns full T6/T7 consumption; product, M3, G-SHADOW
  and production release gates remain independent.
- Supporting historical context-builder/catalog seed shapes and admitted immutable input registration
  are fixture-only. No S15/S16, S21-S26, COMMIT_READY, S34-S37 or downstream target outputs are seeded.
- Oversized sealed membership is denied by the earliest fixture preparation source capture before any
  F/D/N or action output; the test records that actual denial stage, not a manufactured downstream artifact.
- KL075/KL076 integration records are absent at protected base; their actual normal merges, PASS results
  and required reviews were independently verified. This task does not rewrite their governance records.
- Hosted unchanged PostgreSQL/quality and final-head selected-task merge gate must PASS before ordinary
  merge. Task PASS and independent review/merge/product PASS remain separate.
follow_up_tasks:
