decisions:
  - Capabilities are derived only from the immutable role matrix and are excluded from serialized identity payloads.
  - Subject and admin have distinct production capabilities; production boundaries require the exact capability rather than a generic production classification.
  - Test simulation and isolated evaluation remain nonproduction categories with no capability promotion path.
  - Role capabilities are coarse classification markers and never replace trusted role binding, command policy, authorization, scope, or transaction guards.
known_limitations:
  - Authentication and trusted persistence of role assignments remain outside this vocabulary-only task.
  - Production issuance and auto-activation remain disabled pending their independent release gates.
