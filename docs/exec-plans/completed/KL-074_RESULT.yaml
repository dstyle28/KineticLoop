decisions:
- Preserve all lifecycle bytes except readiness_lifecycle_candidate(before); retain original SQL/authentication/credentials/image/ports/volume/namespace
  semantics.
- Create only the byte-exact ratified additive kl074-readiness workflow; both existing workflows remain
  byte-identical.
- Use only dedicated GitHub-hosted local Docker for actual-image coldstarts and full legacy DB suites;
  no developer/shared Docker execution.
- Replace coarse socket sampling after its measured-witness failure with a bounded concurrent read-only
  observer; lifecycle TCP/SQL is not delayed by that observer.
- Verify run/job/head/attempt/repository identities and downloaded archive digest before recording PASS;
  preserve all raw artifact bytes and historical failure diagnostics in envelopes.
- Keep product requirements and release gates separate; no product/release/auto-activation PASS is claimed.
known_limitations:
- The first hosted candidate failed because coarse observations missed the short socket-only window; its
  full-suite step was NOT_RUN. Its verified raw failure artifact is retained separately and never counted
  as PASS.
- Evidence pins the actual configured PostgreSQL image and entrypoint observed at tested_commit; no inference-only
  or production claim is made.
- The draft evidence-collection heads correctly failed the missing-result merge gate. Fresh independent
  reviews, the review-record-only suffix check and every applicable final-head CI/gate must pass before
  normal merge.
follow_up_tasks:
- Complete fresh SHA-bound GENERAL, DB_CONCURRENCY and SECURITY_DATA_BOUNDARY reviews; persist only task-scoped
  review records afterward.
- Verify final relevant-head normal CI, hosted readiness evidence job and selected merge gate before normal
  merge.
- Record post-merge integration separately without modifying this reviewed result.
