summary: Repaired PostgreSQL final-server readiness using the exact ratified lifecycle candidate, explicit
  container loopback TCP probes and aligned Compose healthcheck. Deterministic tests fail the protected
  old code and prove bounded unready behavior, exact owned reset SQL, unchanged socket authentication
  and no SQL replay. Three dedicated hosted coldstarts verified actual socket-only initialization, shutdown
  and final TCP startup with zero measured lifecycle SQL before final readiness, identical image/entrypoint
  provenance, existing two-phase migrated bootstrap, reset sentinel removal and owned cleanup. The exact
  hosted full repository command passed 912 tests; all ten task command/oracle checks pass at tested_commit.
