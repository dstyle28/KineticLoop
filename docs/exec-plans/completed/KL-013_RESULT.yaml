decisions:
  - Use the KL-010 physical topology as the sole base-table creation and dependency order.
  - Materialize every user-scoped reference as a composite subject-and-identity foreign key so cross-subject references fail in PostgreSQL.
  - Materialize the KL-011 four-relation typed fact-child plan with closed value states, zero-versus-missing checks, units, and mandatory S09/S10/S13 field provenance.
  - Bind each typed fact child to the parent revision's stable fact identity as part of the same-subject composite foreign key.
  - Materialize S47 polymorphic source revisions as the two required target-typed S14 and S20 child-edge tables rather than an open reference payload.
  - Reconcile KL-012 runtime ACLs deny-by-default and add defense-in-depth immutable triggers to every immutable base and child table.
  - Preserve cluster-scoped NOLOGIN roles across downgrade because isolated worktree databases share one PostgreSQL cluster and another database may still use those roles.
known_limitations:
  - This baseline installs storage constraints and command-owner privileges; downstream tasks still own concrete SECURITY DEFINER command routines and transaction implementations beyond the KL-012 materialized guards.
  - No product requirement status is claimed; requirements_covered remains empty as declared by the packet.
follow_up_tasks:
