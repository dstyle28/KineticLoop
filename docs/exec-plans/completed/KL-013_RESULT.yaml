decisions:
  - Keep the frozen logical relation inventory one-to-one with physical tables in the kineticloop schema and identify every table with its S01-S51 comment.
  - Materialize KL-010 base edges as same-subject composite foreign keys and add authority pointers only after all base relations exist.
  - Keep the KL-011 child inventory closed to four typed relations with explicit state/value/unit/provenance checks and no prescription reference.
  - Reconcile every migrated table against PUBLIC and every runtime role before granting the exact KL-012 cells; application and audit remain SELECT-only and writer roles remain NOLOGIN/NOINHERIT.
  - Install defense-in-depth mutation triggers on all immutable logical tables, typed fact children, and replay edges, with separate build-to-immutable gates for S15 and S16.
  - Keep SafetyRegistry as an independent seeded singleton and add no command routine that could bypass the frozen S51/S01 ordering contract.
  - Keep S49/S50 in the global registry namespace without fabricated subject identity, and require S42 to bind its complete manifest, policy, evidence, validation, prescription, artifact and S51 basis.
  - Materialize frozen natural identities as non-null database unique constraints so retries and concurrent writers cannot bypass idempotency in application code.
  - Reconcile every runtime role's security attributes and memberships on upgrade, and expose application mutation only through the narrow idempotent policy publication routine until downstream command owners install their own reviewed entrypoints.
  - Serialize S16 writes with S15 lifecycle transitions by locking both old and new parents and rejecting mutation once either parent is no longer BUILDING.
  - Freeze table creation in a static initial revision; current SQLAlchemy metadata remains the reviewed schema declaration for later migrations.
known_limitations:
  - Command-specific SECURITY DEFINER routines beyond the baseline policy-publication proof and repository transaction implementations remain owned by their downstream command tasks.
  - PostgreSQL roles are cluster-scoped and are created idempotently; downgrade removes task-owned schema objects but intentionally does not drop shared role identities that another isolated database may use.
  - This task proves schema inventory, rebuild, topology, and history protection only and claims no product requirement PASS.
