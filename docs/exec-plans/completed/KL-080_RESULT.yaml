decisions:
- Keep S27 intent ADMITTED and derived S36 aggregate CONFIRMED distinct from frozen physical S13 ELIGIBLE
  and S12 MATCHED; no aliases or migrations.
- Keep duplicate-fact verification solely in the own KL080 suite; all existing current fixtures have only
  enum/hash corrections and the shared full output assertion is byte-identical to protected base.
- Align only the own fixture process, including the exact prior-deployment child, with its registered
  UTC test calendar and restore timezone after cleanup; preserve the real clock and trusted calendar guard.
- Use a narrowly shared internal exact freshness read helper in actual full T6 and independently labeled
  PostgreSQL support probes; actual T6 still reconstructs owner outputs first.
- Represent historically accepted invalid source rows via exact Git-verified protected-base deployment
  in a separate subprocess using only current task-owned lifecycle/URLs. Its genuine owners stop at COMMIT_READY;
  the untouched request fails corrected current reconstruction with complete zero effects.
- Keep all actual planning and execution outputs command-owned. Seed only immutable source/support catalog
  inputs; use canonical input/seal/projection/publication/preparation/runtime registration owners.
- Validate actual duplicate-event positive and conflicting-quantity negative cases in both PostgreSQL
  preparation profiles; assert exact member IDs and one deduplicated event.
- Derive every local lifecycle and connection from the fixed source label, exact HEAD and resolved-root
  digest, including every nested bootstrap and finally cleanup. Older DB regressions run only in unchanged
  hosted full CI.
- 'Follow merged HG049 exact oracle: canonical full actions execute T6/T7; mechanical preparation stays
  positive to COMMIT_READY and untouched well-formed authenticated mechanical S37 presentation denies
  at actual legacy prepare_authorization_basis. Preserve consumer runtime; do not claim later certificate
  guard reach.'
- Observe the native first-use daily head inside actual T6 before the unchanged dependency guard denies,
  then prove complete rollback including that head; read-only observation does not seed outputs or replace
  guards.
- Apply only the four schema-pinned HG051 historical representations with archive_original/archive_envelope,
  committed storage and then the exact mapping before new testing. Verify original byte recovery, preserved
  failure/record bindings and normal ancestry; archival retrieval is never execution or PASS. All non-migrated
  prior evidence remains byte-identical.
- Preserve frozen authorities, index, requirements, backlog, harness and CI relative to merged protected
  base; exactly six bounded source literal changes remain in the four older fixture files.
- Capture each new execution losslessly under the unchanged 16 MiB total budget; share identical content-addressed
  payloads only for genuinely identical raw bytes.
- Use docs/exec-plans/evidence/KL-080/HG051-hosted-index-correction/hosted-db-verification.json as the
  authoritative hosted execution index. Independent General review found two stale references in the earlier
  derived index; preserve that old record, correct only new metadata and independently verify every corrected
  reference and hosted manifest artifact against exact Git bytes.
known_limitations:
- Mechanical denial reaches the existing dependency bounds guard in prepare_authorization_basis; a later
  synthetic certificate guard is not reached. No canonical mechanical execution success is claimed.
- Physical malformed values other than historical ADMITTED+CONFIRMED have pure/preparation and exact PostgreSQL
  predicate support; support probes are not claimed as end-to-end T6 freshness reaches.
- Exact expiry equality is pure coverage; real PostgreSQL boundary witnesses require database time strictly
  beyond expiry.
- Hevy/HealthKit, product obligations, M3, G-SHADOW and production release remain independent. This task
  creates only isolated TEST execution outputs.
- Unmodified harness command used its two-worker runner. Raw collection, observed execution, stdout and
  JUnit were retained losslessly through external hardlinks; its ephemeral manifest was not captured and
  is not reconstructed.
- Hosted DB run 37161315464 uses protected master workflow-ref SHA 1d30751 but its verified actual tested_commit
  is feb3236c175df171611fc5b7ddb4f6eeca3ce47c; all 780 cases and lifecycle checks pass. Installed App/controller
  final review-head gating is coordinator-owned and not claimed here.
- The original HG051 hosted-db-verification.json index at 5812ff2ca2c45bfe88c743e36656ea1921112ed6 contains
  two stale navigation references and is superseded by docs/exec-plans/evidence/KL-080/HG051-hosted-index-correction/hosted-db-verification.json.
  Its bytes remain historical evidence of the corrected review finding; it is not the current hosted verification
  index. Raw outputs, tested SHA, counts and cleanup are unchanged; this correction is not a new test
  run.
follow_up_tasks:
- Obtain four fresh independent GENERAL/PROTOCOL/DB_CONCURRENCY/SECURITY_DATA_BOUNDARY reviews at this
  committed implementation/result revision; only own REVIEW_RECORD_ONLY suffix may follow.
- Normal gates and installed controller/admission gating require actual PASS before task DoD or merge.
  Any subsequent master merge or implementation/result/evidence change requires a new testing/review cycle.
