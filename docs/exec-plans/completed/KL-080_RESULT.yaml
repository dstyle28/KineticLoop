decisions:
- Keep S27 intent ADMITTED and derived S36 aggregate CONFIRMED distinct from frozen physical S13 ELIGIBLE
  and S12 MATCHED; no aliases or migrations.
- Keep duplicate-fact verification solely in the own KL080 suite; all existing current fixtures have only
  enum/hash corrections and the shared full output assertion is byte-identical to protected base.
- Align only the own fixture process, including the exact prior-deployment child, with its registered
  UTC test calendar and restore timezone after cleanup; preserve the real clock and trusted calendar guard.
- Use a narrowly shared internal exact freshness read helper in actual full T6 and independently labeled
  PostgreSQL support probes; actual T6 still reconstructs owner outputs first.
- Represent historically accepted invalid source rows via exact Git-verified protected-base deployment
  in a separate subprocess using only current task-owned lifecycle/URLs. Its genuine owners stop at COMMIT_READY;
  the untouched request fails corrected current reconstruction with complete zero effects.
- Keep all actual planning and execution outputs command-owned. Seed only immutable source/support catalog
  inputs; use canonical input/seal/projection/publication/preparation/runtime registration owners.
- Validate actual duplicate-event positive and conflicting-quantity negative cases in both PostgreSQL
  preparation profiles; assert exact member IDs and one deduplicated event.
- Derive every local lifecycle and connection from the fixed source label, exact HEAD and resolved-root
  digest, including every nested bootstrap and finally cleanup. Older DB regressions run only in unchanged
  hosted full CI.
- Preserve every frozen authority, current index/requirements/backlog, shared harness/CI file and historical
  artifact. The four bounded older fixture files contain exactly six allowed source literal replacements.
- Do not widen the legacy authorization consumer or replace the required positive oracle with expected
  denial. Record the unresolved packet/scope contradiction as BLOCKED.
known_limitations:
- Positive actual legacy mechanical preparation reaches COMMIT_READY, but legacy T6 prepare_authorization_basis
  rejects S37.ref_s34_id=N because it requires equality with D.ref_s34_id=F. Mechanical producer semantics
  bind N.demand_feature_id=D. Static inspection also identifies a later synthetic-certificate contract
  mismatch; that later guard was not reached. transactions.py changes outside full source checks are forbidden
  by this packet.
- The legacy positive owner trajectory fails once in its named selector and once in the full own suite.
  Neither is skipped, xfailed, suppressed, or relabeled PASS. Each failure records the actual reached
  guard and complete unchanged output/source/receipt/event/outbox/head/root/session snapshot.
- Physical malformed values other than the historical ADMITTED+CONFIRMED representative have exhaustive
  pure/preparation and exact predicate support coverage; support probes are not end-to-end T6 freshness
  reach claims.
- Canonical DB clock boundary tests wait strictly beyond expiry; exact expiry equality is covered only
  in pure tests.
- Hevy/HealthKit, product obligations, M3, G-SHADOW and production release status remain independent.
  Real-data shadow and production have no task execution issuance/head/binding.
- Hosted unchanged full PostgreSQL CI and selected-task merge gates must be assessed independently; no
  workflow optimization or governance baseline change is included.
- Actual hosted quality workflow 37081179330 passed on tested_commit; hosted PostgreSQL workflow 37081179328
  is running the unchanged full DB command. Its pre-review status is recorded with exact revision and
  workflow hashes; pending is not hosted PASS.
follow_up_tasks:
- Coordinator must refine the legacy positive trajectory oracle to actual legacy COMMIT_READY plus actual
  full T6/T7, or assign/authorize a separate legacy consumer compatibility task. This task cannot become
  PASS under its current implementation boundary.
- Four fresh independent GENERAL, PROTOCOL, DB_CONCURRENCY and SECURITY_DATA_BOUNDARY reviews are required
  at the committed implementation/result SHA. Only own REVIEW_RECORD_ONLY append may follow; no merge
  is authorized.
