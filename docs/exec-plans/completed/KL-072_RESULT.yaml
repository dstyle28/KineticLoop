decisions:
  - Keep the immutable KL-013 baseline byte-unchanged and express all integration DDL in one direct successor.
  - Keep cluster-role bootstrap, memberships, and ownership handoff external to Alembic Phase B.
  - Make the successor's catalog-only role preflight its first action and reject missing, elevated, inheriting, or cross-member protected roles before DDL.
  - Retain every S01-S51 table, sequence, and non-command guard under NOLOGIN kl_migration_owner ownership.
  - Use six non-overloaded command-specific shared-gate routines rather than a caller-selected generic command routine.
  - Bind RevokeArtifact execution to pg_has_role(session_user, kl_trusted_admin, MEMBER) and persist session_user as operator identity.
  - Keep T2-GLOBAL exclusive S51 coordination independent of S01 while shared commands retain S51-before-S01 ordering through transaction commit.
  - Preserve management receipt, audit-event, causation-incident, and outbox-delivery identities in immutable migrated companion relations linked to S50.
known_limitations:
  - Cluster roles, deployment memberships, login credentials, database ownership changes, and the Phase A ownership handoff remain external deployment responsibilities by design.
  - Downstream T3, T6, and T7 domain mutations remain owned by KL-017, KL-018, and later command-owner tasks; KL-072 installs only the registry gate and revoke entrypoints.
  - No product requirement PASS is claimed; requirement-layer evidence remains independently NOT_RUN.
follow_up_tasks:
