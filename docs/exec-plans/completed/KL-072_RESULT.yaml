summary: >-
  Added one cluster-role-DDL-free SafetyRegistry successor migration and an exact
  external two-phase PostgreSQL deployment harness. Phase A applies the immutable
  KL-013 baseline under kl_cluster_bootstrap, external administration hands all
  schema objects to NOLOGIN kl_migration_owner, and a new NOSUPERUSER/NOCREATEROLE
  deployer session performs fail-closed role preflight before applying Phase B.
  Migrated objects remain migration-owner owned while seven narrow fixed-search-path
  SECURITY DEFINER routines are owned by kl_writer_safety_registry. Six shared-gate
  routines are executable only by kl_application and RevokeArtifact only by distinct
  kl_trusted_admin. The production repository now uses those migrated routines, and
  revoke authorization plus operator identity derive from the authenticated database
  session while S50 and companion immutable records preserve idempotency, incident,
  audit, and outbox identities.
