decisions:
- Use separately authenticated existing TEST identity primitives and exact registered subject/policy/environment/principal
  owner binding, with no public wire or owner matrix changes.
- Only an internal server plan supplies S21 revision=1; caller revision/provenance stays forbidden and
  REQUIRED_FIELDS/metadata remain complete. Natural computation identity binds canonical source/dependencies;
  request provenance binds engine/window/content/validity.
- Verify exact same-subject SEALED S15 inside independent short preparation transactions. Record all positive
  and collection/absence dependencies with S21 atomically, deriving explicit references only from the
  source.
- Owner-local advisory identity locks serialize missing projection/build contenders; only exact S23 row
  lock completes BUILDING to READY. Immutable history replays before current eligibility and cannot relabel
  captured basis or restore authority.
- Use the unchanged pure artifact activation predicate against source-captured policy/catalog/release
  closure. Actual T3 independently rechecks current S01 basis, S51 eligibility and trusted time under
  the unchanged frozen order.
- Derive every local Compose/database namespace from KL078, exact tested HEAD first7 and SHA256 of resolved
  worktree first12; validate constructor/bootstrap/nested reset/start/Compose/final cleanup and preserve
  peer resources.
known_limitations:
