decisions:
- Actual KL075 and HG039 normal merges precede this implementation. The existing strict public CancelIntent
  and 39-command validator remain byte-identical; only the ratified TEST-local request/binding/basis/history
  recipe is installed in the allowed test file.
- Use separately trusted PlanningIdentity(TEST), exact registered subject/policy/environment/principal before
  replay and again under S01, and a server-computed canonical full-payload hash. No caller actor, authorization
  grant or hash is admitted.
- "Root cancellation uses only the existing S01\u2192S27\u2192S31\u2192receipt owner and status-only S27 update\
  \ with atomic bookkeeping. RESERVED cleanup remains a separate actual CancelUndispatched transaction; DISPATCH_INTENT\
  \ preserves occupation and dispatch identity, with no refund or resend."
- Two actual idle preflight misses are synchronized outside coordination; the winner commits exactly one cancellation
  and the contender rechecks successful historical S02 under S01 before live-root guards, with original non-executable
  facts and no second mutation/bookkeeping.
