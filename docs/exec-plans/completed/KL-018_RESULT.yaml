summary: >-
  Added the one cluster-role-DDL-free artifact-registry successor after KL-072.
  RegisterArtifact now derives authority and operator identity from the authenticated
  trusted-admin database session, holds the exclusive S51 gate, enforces immutable
  S49 identity, NULL-total validity, complete bounded dependency closure, and an
  explicit revocable policy artifact for TIMELESS approval, and atomically appends
  S49, edges, receipt, event, and outbox evidence. Dense or over-bound closures,
  immutable and natural-identity conflicts, lock timeout, and injected post-write
  failure all return stable fail-closed behavior without partial mutation. Public
  input-shape, dependency, cycle, and binding-root failures are normalized to the
  frozen denial vocabulary. T3 binds the supplied complete identities to the actual
  current S24 manifest root and closure digest, while upgrade deterministically
  rejects any malformed legacy TIMELESS row before installing the hardened rules.
