decisions:
  - Keep KL-013 and KL-072 byte-unchanged and install exactly one direct successor.
  - Reuse the externally provisioned KL-072 role boundary and repeat its fail-closed catalog preflight before successor object changes.
  - Make RegisterArtifact a distinct registry-management transaction that takes S51 FOR UPDATE, never S01, and does not advance the revocation-only registry revision.
  - Derive both SQL authorization and persisted operator identity from session_user membership in kl_trusted_admin; caller actor/capability is not an SQL input.
  - Treat the supplied dependency array as the complete immutable transitive closure and independently verify pre-registration, completeness, acyclicity, uniqueness, a 128-node bound, and a 16-edge depth bound.
  - Bind POLICY to S05, TOOL to S19, and MODEL/PROMPT/RUNTIME to S48 while preserving the exact typed-root invariant for legacy artifact kinds.
  - Append S49, normalized closure edges, registration receipt, audit event, and outbox in one transaction held under the exclusive gate; exact replay returns the original record and different identity content is rejected.
  - Preserve deny-by-default S49/S51 DML and expose EXECUTE only to kl_trusted_admin.
known_limitations:
  - Cluster roles, login credentials, memberships, and ownership handoff remain external deployment responsibilities established by KL-072.
  - The pre-existing tests/db/test_safety_registry.py SECURITY DEFINER closed-list assertion names only the seven KL-072 routines and therefore reports the intentional KL-018 eighth routine; that out-of-scope test file was not changed, while every packet-owned DB aggregate and all 16 required checks pass.
  - No product requirement PASS or production auto-activation is claimed.
