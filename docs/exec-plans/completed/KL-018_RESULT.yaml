decisions:
  - Keep the frozen authorities, KL-013 baseline, and KL-072 successor byte-unchanged and install exactly one later successor.
  - Treat the submitted dependency array as the exact transitive closure and verify it with a bounded duplicate-suppressing traversal rather than path enumeration.
  - Represent TIMELESS approval policy as the canonical UUID of a pre-registered POLICY or POLICY_BUNDLE artifact that must occur explicitly in the submitted closure.
  - Bind T3 to the current S24 root and stored closure digest while retaining caller-side closure construction outside the coordination transaction.
  - Fail successor upgrade closed when a legacy TIMELESS row lacks a canonical registered policy artifact and explicit dependency edge.
  - Preserve the frozen denial vocabulary by mapping invalid shape, incomplete or cyclic dependency structure, and an unprovable over-bound closure to VALIDITY_UNDEFINED; unknown roots to ARTIFACT_UNKNOWN; and both immutable conflict forms to IMMUTABLE_ARTIFACT.
  - Preserve the exclusive S51-before-write order and rely on the top-level command transaction to roll back every registration side effect on timeout or later failure.
  - Keep EXECUTE limited to kl_trusted_admin while retaining deny-by-default direct S49/S51 DML and writer-role assumption.
known_limitations:
  - Cluster roles, login credentials, memberships, and ownership handoff remain external deployment responsibilities established by KL-072.
  - No product requirement PASS or production auto-activation is claimed.
