decisions:
  - Install one canonical superuser-owned ddl_command_start event trigger during external two-phase cluster bootstrap and require its exact enabled function inventory before d4 upgrade or downgrade.
  - Bind DDL denial to authenticated session_user and the canonical subject-login name pattern, so deleting or corrupting a binding cannot enable SET ROLE DDL.
  - Deny all DDL from a bound or canonically named subject session, closing RLS disablement, policy/trigger/function removal, protected-relation changes, and REFERENCES foreign-key existence probes.
  - Run the protected row trigger as SECURITY INVOKER and pass its invoking current_user to the fixed-search-path SECURITY DEFINER RLS helper for exact command-owner, binding, subject, namespace, role-graph, ACL, and ownership validation.
  - Cover INSERT, UPDATE, DELETE, and TRUNCATE in the storage trigger so BYPASSRLS can never become a direct bound-subject write path.
  - Force RLS on S38, S42, S45, S46, and S47 with separate SELECT, INSERT, UPDATE, and DELETE policies; retain the authenticated-principal lookup and exact-subject non-enumeration boundary.
  - Acquire registration ACCESS SHARE and downgrade ACCESS EXCLUSIVE locks in the global order S38, S42, S45, S46, S47, subject scopes, principal bindings; hold downgrade locks through destructive DDL.
  - Leave the external event trigger installed across downgrade; it skips absent binding metadata while continuing to deny canonical subject-login DDL.
  - Preserve frozen S51-before-S01 and T6/T7 command-owner semantics; the RLS, DML, and DDL guards enforce persistence boundaries only.
known_limitations:
  - Cluster roles, subject credentials, memberships, ownership handoff, and the canonical superuser event-trigger installation remain external two-phase deployment responsibilities documented in docs/contracts/subject_scope.md.
  - Subject principals must never receive SUPERUSER or BYPASSRLS. PostgreSQL cannot mediate SELECT for a principal after a cluster administrator grants either attribute; ALTER ROLE, event-trigger administration, and direct superuser data access remain trusted cluster-administration and continuous-audit boundaries.
  - Operators must retire all classifications, bindings, and protected S38/S42/S45/S46/S47 data before downgrade.
  - No product requirement PASS or production auto-activation is claimed.
follow_up_tasks:
