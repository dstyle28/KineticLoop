summary: >-
  Added a real successor to the KL-018 migration head that isolates production,
  test, and evaluation persistence by authenticated database principal and exact
  subject. Externally provisioned subject-specific LOGIN principals inherit one
  namespace role and are durably bound to one subject by trusted-admin
  registration. The fixed-search-path lookup derives its subject and namespace
  only from session_user, rejects writer-role drift, and returns the same null
  result for nonexistent objects and foreign objects, including objects owned by
  another subject in the same namespace. Storage guards enforce TEST_ONLY policy
  and execution bindings and keep evaluation rows out of live storage. Upgrade
  preflight rejects direct or transitive writer-assumption paths before DDL, and
  downgrade fails before any guard or ACL change while TEST or EVALUATION scope
  or principal bindings remain.
