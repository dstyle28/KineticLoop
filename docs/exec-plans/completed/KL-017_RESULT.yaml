decisions:
  - Require an externally provisioned subject-specific LOGIN principal for each registered production, test, or evaluation subject; shared namespace logins cannot be registered as subject principals.
  - Persist a one-principal-to-one-subject binding and derive every lookup subject and namespace from session_user without caller-provided subject or namespace data.
  - Keep the namespace roles NOLOGIN and deny every subject principal any direct or transitive MEMBER or SET path to every kl_writer_* role, with runtime revalidation on lookup.
  - Bind TEST registration to one same-subject test policy and isolated environment and require exact TEST_ONLY authorization and execution bindings at the storage boundary.
  - Return SQL NULL for missing, cross-namespace, and same-namespace foreign-subject objects and map all cases to the same SUBJECT_SCOPE_DENIED payload and BOUNDED_SCOPE_LOOKUP classification.
  - Fail downgrade before object or privilege changes whenever a TEST or EVALUATION scope or principal binding exists, preserving guards, data, and denied shared production reads atomically.
  - Serialize namespace registration and protected writes with the same subject-derived transaction advisory lock so concurrent first writes cannot race scope assignment.
  - Preserve the frozen S51-before-S01 ordering and leave T6/T7 issuance to their command owners; the new triggers add storage classification checks only.
known_limitations:
  - Cluster roles, subject-specific login credentials, memberships, and ownership handoff remain external deployment responsibilities established by the two-phase bootstrap model.
  - Operators must explicitly retire TEST and EVALUATION scopes before downgrading to the predecessor revision.
  - No product requirement PASS or production auto-activation is claimed.
