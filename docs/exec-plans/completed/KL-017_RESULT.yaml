summary: >-
  Isolated production, test, and evaluation persistence by authenticated database
  principal and exact subject. All five protected tables now force row-level
  security. Bound subject sessions revalidate their durable binding, namespace,
  role graph, ACLs, ownership, and schema/routine authority on every protected
  access. Reads expose only the exact subject; writes additionally require the
  table's exact current_user command owner while session_user remains safely bound.
  Statement-level truncate guards and row triggers close direct DML. Downgrade
  obtains fixed-order transaction-held locks across S38/S42/S45/S46/S47 and scope
  metadata before scanning, so registration or writes cannot enter between the
  empty-state decision and guard removal.
