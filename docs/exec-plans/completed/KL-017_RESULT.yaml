decisions:
  - Force RLS on S38, S42, S45, S46, and S47 with separate SELECT, INSERT, UPDATE, and DELETE policies backed by one fixed-search-path SECURITY DEFINER policy helper.
  - Revalidate the bound session_user principal's safe attributes, sole scope membership, complete reachable-role graph, protected ACLs and ownership, schema CREATE, and in-schema routine ownership at access time.
  - Require the exact per-table writer as current_user for bound-session DML, preserving clean SECURITY DEFINER command owners while denying direct ACL, bridge-role, writer, migration-owner, ownership, and SET ROLE drift.
  - Restrict unbound RLS reads to the migration owner, exact table writer, auditor membership, and the SafetyRegistry writer's required S42 read.
  - Reject bound-subject TRUNCATE through statement-level BEFORE TRUNCATE triggers and retain row-level namespace, classification, and subject immutability guards.
  - Acquire registration ACCESS SHARE and downgrade ACCESS EXCLUSIVE locks in the global order S38, S42, S45, S46, S47, subject scopes, principal bindings; hold downgrade locks through destructive DDL.
  - Fail downgrade before DDL or ACL change whenever any scope, binding, or protected row remains, including state committed by a transaction that was active when downgrade began.
  - Preserve frozen S51-before-S01 and T6/T7 command-owner semantics; RLS and triggers enforce storage boundaries only.
known_limitations:
  - Cluster roles, subject credentials, memberships, and ownership handoff remain external two-phase deployment responsibilities.
  - FORCE RLS denies ordinary access after accidental table-owner drift, but PostgreSQL table owners can issue DDL to disable RLS. Ownership changes therefore remain a trusted deployment boundary and must not be delegated to subject principals.
  - Operators must retire all classifications, bindings, and protected S38/S42/S45/S46/S47 data before downgrade.
  - No product requirement PASS or production auto-activation is claimed.
