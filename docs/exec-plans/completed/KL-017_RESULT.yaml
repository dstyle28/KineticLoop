summary: >-
  Added a real successor to the KL-018 migration head that gives production,
  test, and evaluation subjects separate persistence namespaces. Trusted-admin
  registration binds TEST subjects to an isolated policy and environment and
  EVALUATION subjects to an isolated environment. Security-definer storage
  guards reject TEST authorization or execution outside TEST_ONLY bindings and
  prevent evaluation rows from crossing into live storage. Runtime credentials
  have exactly one scope role and no direct access to protected tables; the
  fixed-search-path lookup returns the same null result for missing and foreign
  objects, which the application maps to one stable non-enumerating denial.
  Registration and first protected writes share a transaction-scoped subject
  lock, closing the unregistered-subject classification race.
