summary: >-
  Isolated production, test, and evaluation persistence by authenticated database
  principal and exact subject. A superuser-owned external ddl_command_start guard
  now denies DDL from registered or canonically named subject sessions using
  session_user, including after binding deletion, SET ROLE, ownership, or migration
  role drift. FORCE RLS remains active on all five protected tables, while an
  invoker row trigger independently rejects direct INSERT, UPDATE, DELETE, and
  TRUNCATE under ACL, role, owner, or BYPASSRLS drift. Downgrade retains the external
  guard and holds fixed-order locks through its empty-state check and destructive DDL.
