summary: >-
  Added a real successor to the KL-018 migration head that isolates production,
  test, and evaluation persistence by authenticated database principal and exact
  subject. Subject-specific LOGIN principals are durably bound to one subject and
  namespace, cannot acquire protected-object bypasses or any direct/transitive
  kl_writer_* path, and are rejected by storage guards if runtime drift permits
  direct DML or SET ROLE. Protected subject identifiers are immutable. Lookup
  derives identity from session_user, and the application verifies every returned
  kind, object, subject, and namespace before release. Existing production objects,
  same-namespace foreign objects, and nonexistent objects share one non-disclosing
  denial for both TEST and EVALUATION actors. Downgrade fails before DDL or ACL
  change whenever any classification, principal binding, or protected row remains.
