decisions:
  - Keep unregistered subjects in the production compatibility namespace while requiring immutable trusted-admin registration before TEST or EVALUATION storage is admitted.
  - Bind TEST registration to one same-subject test policy and isolated environment; require exact TEST_ONLY policy and execution bindings at the storage boundary.
  - Give production, test, and evaluation logins exactly one inherited NOLOGIN scope role and expose protected rows only through the fixed-search-path subject_scope_lookup routine.
  - Return SQL NULL for both missing and foreign-scope objects and map both cases to the same SUBJECT_SCOPE_DENIED payload and BOUNDED_SCOPE_LOOKUP classification.
  - Serialize namespace registration and protected writes with the same subject-derived transaction advisory lock so concurrent first writes cannot race scope assignment.
  - Preserve the frozen S51-before-S01 ordering and leave T6/T7 issuance to their command owners; the new triggers add storage classification checks only.
known_limitations:
  - Cluster roles, login credentials, memberships, and ownership handoff remain external deployment responsibilities established by KL-072.
  - No product requirement PASS or production auto-activation is claimed.
