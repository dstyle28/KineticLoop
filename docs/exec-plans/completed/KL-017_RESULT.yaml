decisions:
  - Require an externally provisioned subject-specific LOGIN principal for each registered subject and bind it one-to-one to a subject and namespace by trusted-admin registration.
  - Reject direct protected-table ACLs, protected-table or in-schema routine ownership, schema CREATE, effective protected-object bypasses, and every direct/transitive MEMBER or SET path to kl_writer_* during preflight or registration.
  - Recheck writer reachability in the storage trigger and reject direct subject-session DML after SET ROLE while preserving legitimate SECURITY DEFINER command-owner writes.
  - Make subject_id immutable on updates to S38, S42, S45, S46, and S47.
  - Derive lookup identity only from session_user and validate the returned kind, object identifier, subject identifier, and namespace at the application boundary.
  - Return SQL NULL for missing, cross-namespace, and same-namespace foreign objects and map every denial to SUBJECT_SCOPE_DENIED with BOUNDED_SCOPE_LOOKUP and one non-disclosing payload.
  - Fail downgrade before any trigger, routine, table, or ACL change whenever any scope, principal binding, or protected S38/S42/S45/S46/S47 row exists.
  - Preserve the frozen S51-before-S01 order and leave T6/T7 issuance to existing command owners; the new triggers add storage-boundary checks only.
known_limitations:
  - Cluster roles, subject-specific credentials, memberships, and ownership handoff remain external two-phase deployment responsibilities.
  - Operators must retire all subject classifications, bindings, and protected S38/S42/S45/S46/S47 data before downgrade.
  - No product requirement PASS or production auto-activation is claimed.
follow_up_tasks:
