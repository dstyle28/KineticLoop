  duplicated verified immutable identities/hashes. No migration or new direct-F Nutrition column is introduced.
- The explicit versioned mechanical fixture policy defines minutes, fixture units, half-open window, complete
  admitted source membership, underlying-event deduplication, unknown-exposure denial and exact actual
  replacement of reservation slots. Planned quantities never create actual facts.
- Use actual RecordActualExecution for the isolated accepted source fact and execution-basis event; do
  not seed pipeline outputs, certificates, COMMIT_READY, heads, issuances, bindings or root success.
- Every named selector and the complete own suite ran on tested_commit. Raw persisted ID/hash/FK/receipt/event/outbox
  witnesses, post-lock trusted-time bounds, observed blocking, rollback, replay, execution counts and
  exact namespace cleanup are committed.
- A fresh owned database per case preserves the canonical one-subject principal registration. Namespace
  proof precedes every lifecycle constructor/reset; bootstrap receives the selected lifecycle and every
  connection/cleanup verifies only the own HEAD/root-derived fixture target.
- The prior BLOCKED diagnostic/result is retained as historical evidence only. KL078 normal merge c599ec1
