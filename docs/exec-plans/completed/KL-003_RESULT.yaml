decisions:
  - Use lower-case hyphenated RFC 4122 UUIDs as the canonical ID wire form and UUIDv4 for generation.
  - Accept identifier inputs only when their exact type is str or UUID, preventing subclasses from substituting stored or presented identity.
  - Accept time inputs only when their exact type is str or datetime, require exact built-in fixed-offset timezone providers for datetime inputs, return exact built-in datetime/string values, emit RFC 3339 UTC with fixed microsecond precision, and reject naive or behavior-overrideable timestamps.
  - Version canonical JSON as kineticloop-json-v1, admit only exact dict/list and JSON scalar types, normalize strings to NFC, sort object keys by UTF-16 code units, and reject overrideable containers, floats, and values outside the supported JSON domain.
  - Keep the SHA-256 digest separate from its sha256-kineticloop-json-v1 scheme identifier, matching the logical DB baseline's content_hash and hash_scheme_version fields.
  - Require exact bytes for raw hashes and exact canonical str digests for verification, with exact built-in str and bool outputs.
known_limitations:
  - Canonical JSON version 1 intentionally excludes floating-point values, tuples, bytes, and integers outside the signed 64-bit range.
