summary: >-
  Added strict canonical UUID identifiers, UTC instant normalization, versioned
  deterministic JSON serialization, and SHA-256 content hashing with focused
  rejection tests for unsafe or ambiguous inputs. Canonical identity, time, and
  JSON boundaries now require exact built-in input types so subclasses and custom
  mappings cannot substitute validated content through overridden behavior. UTC
  normalization admits only built-in fixed-offset timezone providers, and hash
  inputs, digests, and results preserve exact built-in wire types.
