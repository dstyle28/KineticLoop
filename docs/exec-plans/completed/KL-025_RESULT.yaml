decisions:
- Read actual merged KL024 planning service, root limits/reserved/settled/deadline/fence,
  prerequisite SHA-bound reviews and M2 closure; exact planning fixture patch matches
  HG034 full-file hash. Isolation proof runs first and records derived KL025 SHA/worktree
  digest namespaces.
- Use the workflow namespace package; typed accounting identity and exact finite nonnegative
  integer dimensions retain all unrelated root payload fields. No strict money guarantee
  is claimed; actual above bounds remains recorded and further reservations fail closed.
- Register CancelUndispatched only as bounded internal owner, retaining the closed
  39-command public ingress. Exact locked RESERVED source alone may release a obsolete
  reservation after lease loss; it supplies no stale business or execution authority.
- Owner guards require exact prepared root accounting, reservation identity/bounds/fence
  and immutable transition/deltas with one S27/S31/S32 plus S02/S03/S04 atomic effect.
  Expected revision and merged UNKNOWN-to-OUTCOME_UNKNOWN vocabulary reject blocked
  stale contenders.
- The existing first committed DISPATCH_INTENT winner is sendable after transaction
  release; all preflight and under-S01 replay paths return historical non-sendable
  identities. Recovery never resends that reservation. Physical requests are fake
  PU only; each future retry needs fresh budget coverage.
- Dedicated reliable receipt verifier runs before coordination. Immutable receipt/accounting
  identity and actual maps bind settlement; provider receipt/request natural identities
  cannot settle multiple reservations. Late settlement changes only accounting and
  ledger evidence, preserving terminal/revised/taken-over workflow and control/authorization
  state.
- Historical BLOCKED result, entry audit, unreviewed candidate patch and actual message
  rejection remain preserved. Clarified supplemental full-DB request runs only unchanged
  hosted CI with fresh VM/default local Docker; this removes local foreign-fixture
  execution without modifying packet checks or foreign fixtures.
known_limitations:
- No provider SDK/model loop, DISPATCHED diagnosis, full watchdog/reaper, generic
  progression, production activation, live shadow head or execution binding is implemented.
  Task PU/DC evidence does not discharge W01/W03/W05/W06/W08 WF/E2E or release obligations.
- Trusted ingress must authenticate PlanningIdentity and supply a real reliable receipt
  verifier. Shape and provenance strings alone are not authentication/provider billing
  proof. Count/token limits are enforced; strict_money is false, including when integer
  cost_micros participates in arithmetic.
- This immutable pre-review result records task PASS/UNMERGED. Required fresh independent
  reviews, hosted full database/quality CI and the selected-task merge gate remain
  separate prerequisites before integration.
- The child-to-parent status message was actually rejected by automatic approval review
  for absent explicit human message authorization. No retry or workaround was used;
  parent monitors this chat.
