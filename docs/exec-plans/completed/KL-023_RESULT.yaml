decisions:
- Reuse the single KL-015 owner and existing S15/S16 storage; add no migration, owner, or frozen-baseline
  change.
- Bind ingress-authenticated RoleIdentity and subject to the registered namespace and freeze the unique
  builder at BeginBuild.
- Keep S01 snapshot capture in a separate short read transaction; serialize missing BeginBuild identity
  with S15-local advisory locking and persist exact command hashes/outcomes in immutable build content.
- Reconstruct one repeatable-read candidate snapshot and validate all typed references before acquiring
  S15; Complete rejects any changed member revision.
- At policy factset_max_delta_depth, capture a complete FULL checkpoint in existing S15 typed content,
  drop parent dependency, and overlay subsequent S16 SET/REMOVE operations.
- Seal reads only fixed scalar certificate fields and stored basis digest, validates current frontier/epoch/program/policy,
  and commits S15/S01/S02/S03/S04 through the existing T2-SEAL owner.
- Keep the initial d611ac8 raw evidence, including the regression failure that led to restoring separate
  snapshot capture; final PASS evidence is bound exclusively to tested_commit.
known_limitations:
- B01-B03/I08, product/release acceptance and production activation remain unchanged; this task promotes
  no product requirement or release gate to PASS.
- Trusted ingress must authenticate and bind BuilderIdentity; the Python value object is not an authentication
  token.
- Policy bundles must explicitly supply factset_max_delta_depth for this service; unsupported/missing
  configuration fails closed.
- Association/admission/mapping selection and downstream qualification belong to their command owners/resolver;
  this service retains and validates the complete explicitly selected basis.
follow_up_tasks:
- KL-024 must start from merged KL-023 after parent integration/sync; shared transaction_interfaces/user_coordination
  remain serialized.
- KL-032 owns downstream product acceptance B01-B03/I08; no downstream task was launched.
