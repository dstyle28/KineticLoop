summary: 'Implemented typed subject/builder-bound CanonicalViewService over the KL-015 owner: complete
  selected evidence basis, deterministic bounded FULL/DELTA SET/REMOVE reconstruction with policy-bound
  FULL checkpoint fallback, closed digest/count/certificate, durable build replay, immutable READY and
  SEALED-only canonical reads, and atomic T2-SEAL frontier/epoch/program/policy/basis validation without
  member scans under S01. Real migrated PostgreSQL tests prove builder/key conflicts, completion/writer
  exclusion in both serial orders, T2-IN frontier/epoch races in both serial orders, rollback, and historical
  seal replay after a newer head.'
