decisions:
  - Give every public command surface exactly one repository owner; T6CommitCoordinator is the single atomic database owner for the PrescriptionCommitService and AuthorizationService CommitBundle boundary.
  - Expose no raw SQL, cursor, or connection to callbacks; structured insert/update operations generate identifiers from the owner's logical-table capability and quote columns mechanically.
  - Keep cursor state outside callback capability objects and require literal fail-closed command/table/operation column allowlists that do not auto-adopt future schema columns or expose server-owned known/recorded timestamps, so table access cannot widen field ownership such as T2 writing T3-owned S01 decision_generation.
  - Bind every non-global structured insert/update to the authenticated transaction subject and reject subject reassignment, including preparation and factset-build capabilities.
  - Require every applicable pre-receipt lock and bind S27/S31/S38/S44/aggregate DML to the exact row identity already locked by that command; reject empty, unrelated, repeated, reverse, and command-inapplicable acquisitions.
  - Reject repeated acquisitions of a lock stage and require strictly increasing remaining-aggregate table ranks, so stable order holds across the complete transaction rather than only within one method call.
  - Acquire declared remaining aggregate locks only after the S02 receipt lock on first execution; use a separate receipt-only historical replay entry point so replay never reacquires registry, work, artifact, or current-fence guards and cannot repeat mutations.
  - Treat frozen T1 raw source receipt admission as the sole subject-command exception to S01, serialize a missing T1 natural receipt key with a transaction advisory lock, and forbid any later reverse acquisition of S01.
  - Reuse the merged command-specific SafetyRegistry routines so T3, T6, and T7 obtain S51 then S01 and revalidate exact artifact closure before mutation.
  - Require exact kind, identity, version, and content hash validation for every leased artifact before commit; UUID-only registry eligibility never completes an artifact-consuming command.
  - Bind factset-build capability to command identity; BeginBuild creates the captured BUILDING S15 basis, WriteCandidate atomically adds one S16 and advances one member revision, CompleteFactset freezes the closed revision/digest/certificate, and T2-SEAL revalidates that exact basis against current S01.
  - Store the complete successful outcome in S02 so ACK-loss replay returns the same S39/S40/S41/S42/S43 identities and cannot repeat head, terminal-intent, event, outbox, reservation, closure, or operation effects.
  - Make live fenced commands prove the exact locked intent's current owner, token, live lease, status, request and attempt; make AcquireLease persist a future deadline-bounded lease and make ReapIntent atomically terminate the exact expired S27/S29 chain.
  - Bind T6 inserted references to one exact current intent/request/attempt/validation chain; require intent/S38/S39 day equality and an exact next head revision, persist the locked S38 head as nullable first-head parent metadata, materialize the verified S49 and manifest-projection closure, bind supersession to the exact prior and replacement authorization scope/current receipt/cause, and update S01.execution_basis_event_id to the same-transaction S03 event.
  - Require S42 issuance reason and a server-computed validity certificate containing authorization epoch, fixed method version, artifact/manifest/projection/resolution/validation/request/policy/calendar dependency identities, their bounded minimum expiry, an authoritative issuance time, and a deterministic closure digest bound to the acquired registry revision.
  - Derive artifact closure revision from the immutable database revision rather than parsing the semantic artifact version, and bound T6 authorization validity by every finite leased-artifact expiry plus explicit policy TTL and calendar validity.
  - Bind T6 to the exact current COMMIT_READY attempt, fence, manifest, epoch, validation, resolution, intent, and head; reject cross-wiring among multiple locked aggregates and require exact completion updates.
  - Require T2 input admission to change the frontier, controls to bind same-command S17/S18, actual-execution decisions to advance the execution basis, seal to bind exact S15/S01 state, and invalidation S43 to bind the current receipt, event kind, scope, and cause.
  - Require T3 publication to bind the single READY S23 build, current SEALED factset, exact epoch/frontier/policy/program, verified projection role/basis and S22 dependencies, artifact closure digest, catalog/mapping identities, manifest hash, registry state, and bounded validity; publish the next generation with the exact same-command S25 set and advance S01/S23 to those identities.
  - Permit T4 to create a new root intent while binding S28/S29 and terminal updates to the exact new-or-locked chain, current epoch, and manifest.
  - Require T7 to revalidate the exact prescription/authorization pair including non-revocation, registry revision/state, leased artifact root, complete live artifact closure, scope, content, epoch, and current bundle membership; enforce START/RESUME/CONTINUE lifecycle prerequisites and exact session revision transitions, bind S45 to the validated scope/server time/next binding revision, only START/RESUME append S45, and make all T7 historical replay non-executable.
  - Allow the initial AcquireLease CAS from an unowned NULL-owner/NULL-expiry intent while retaining monotonic fencing and future deadline-bounded expiry; Reauthorize requires only its actual frozen lock surfaces.
  - Bind ReserveCall's S31/S32 to its exact verified live intent/attempt, commit PermitDispatch's S31/S32 transition with S02/S03/S04, require its ref_s27_id and dispatch fence to match the verified live intent/fence, and return executable permission only to the first RESERVED-to-DISPATCH_INTENT winner; every replay is non-sendable.
  - Bind SettleCall and MarkUnknown to one exact locked S27/S31/S29 chain and require the frozen source/target state, next settlement revision, and same-reservation S32 event; remove generic S29 callback mutation from AcquireLease and RenewLease.
  - Require each settlement command's explicit expected transition to equal the locked S31 source state, expose only the server-prepared transition basis to its mutation callback, and reject stale contenders after a preceding transition commits.
  - Remove S29 from AcquireLease/RenewLease lock capabilities as well as their mutation capabilities, so lease commands cannot block unrelated attempts.
  - Require every T2-IN invalidation to carry a nonempty canonical scope, require CompleteFactset to freeze a nonnegative member count in its certificate, and compare the stored READY captured frontier/epoch directly to current S01 during seal.
  - Correct the T3 shared registry gate so it locks S51 then S01 and validates the incoming candidate artifact closure without requiring an outgoing current Manifest; this preserves bootstrap, policy/release transition, and consecutive publication semantics while retaining fail-closed validity and revocation checks.
  - Persist the full declared artifact roots, transitive closure identities, and artifact-only closure digest in immutable S24 typed payload; require every T6 lease to equal that Manifest closure so no independent root can be omitted from S42/T7 enforcement.
  - Require every required S22 dependency kind to carry its authoritative FK, bind S36 to the active policy, and require the locked S38 local date to equal the verified intent date for both CommitBundle and Reauthorize.
  - Anchor T3 artifact admission to the S49 artifact bound to active S05, derive the activated S48 release set through its registered dependency graph, and reject every foreign S05/S19/S48 binding or root before publication.
  - Require candidate artifact roots to equal the graph roots of the verified closure, reject promotion of transitive dependencies, and require an exact S19-bound artifact whenever the sealed mapping selects a catalog.
  - Freeze the READY S23 dependency-basis hash, exact required projection bindings, full artifact closure, declared roots, and closure hash; T3 requires positive plus collection/absence S22 coverage and recomputes the candidate basis before publication.
  - Derive every T2 invalidation scope from the active policy's command classification and every T6 issuance scope from the active policy's exact S36 action mapping; caller-selected scopes fail closed.
  - Derive the complete T3 role inventory and dependency signatures from the active policy, require collection/absence, engine, factset, policy, program, and applicable catalog/mapping dependencies per role, and prove each S14 dependency is an active member of the current SEALED S15.
  - Bind T6 validation to the exact S35 named by its S34 proposal, include that demand revision in the validity certificate, and reject crosswired demand features.
  - Remove S31 from CommitBundle because reservations are T5/T8 state; a T6 command cannot acquire an unrelated reservation lock.
  - Require both CommitBundle and Reauthorize to atomically persist S27 FOUND_VALID_PLAN, S29 COMMITTED, the new S42, and S02/S03/S04; a result reference without terminal success is rejected.
  - Make ReapIntent verify and terminate every requested expired S27/S29 chain without requiring an unrelated reservation lock.
  - Keep OutboxDispatcher limited to an isolated S04 claim and require business work to enter later as a new idempotent command after row-lock release.
known_limitations:
  - These are transaction and repository guard interfaces; downstream command tasks still own their domain-specific guard predicates and mutations within the declared capabilities.
  - The tests use isolated synthetic subjects, policies, artifacts, and command outcomes and claim no product requirement PASS or production auto-activation readiness.
