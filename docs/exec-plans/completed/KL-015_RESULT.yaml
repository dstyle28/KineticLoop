decisions:
  - Give every public command surface exactly one repository owner; T6CommitCoordinator is the single atomic database owner for the PrescriptionCommitService and AuthorizationService CommitBundle boundary.
  - Expose no raw SQL, cursor, or connection to callbacks; structured insert/update operations generate identifiers from the owner's logical-table capability and quote columns mechanically.
  - Keep cursor state outside callback capability objects and require an explicit fail-closed command/table/operation column allowlist, so table access cannot widen field ownership such as T2 writing T3-owned S01 decision_generation.
  - Bind every non-global structured insert/update to the authenticated transaction subject and reject subject reassignment, including preparation and factset-build capabilities.
  - Require every applicable pre-receipt lock and bind S27/S31/S38/S44/aggregate DML to the exact row identity already locked by that command; reject empty, unrelated, repeated, reverse, and command-inapplicable acquisitions.
  - Reject repeated acquisitions of a lock stage and require strictly increasing remaining-aggregate table ranks, so stable order holds across the complete transaction rather than only within one method call.
  - Acquire declared remaining aggregate locks only after the S02 receipt lock on first execution; use a separate receipt-only historical replay entry point so replay never reacquires registry, work, artifact, or current-fence guards and cannot repeat mutations.
  - Treat frozen T1 raw source receipt admission as the sole subject-command exception to S01, serialize a missing T1 natural receipt key with a transaction advisory lock, and forbid any later reverse acquisition of S01.
  - Reuse the merged command-specific SafetyRegistry routines so T3, T6, and T7 obtain S51 then S01 and revalidate exact artifact closure before mutation.
  - Require exact kind, identity, version, and content hash validation for every leased artifact before commit; UUID-only registry eligibility never completes an artifact-consuming command.
  - Bind factset-build capability to command identity; BeginBuild and CompleteFactset receive S15 only, while WriteCandidate receives S15 and S16.
  - Store the complete successful outcome in S02 so ACK-loss replay returns the same S39/S40/S41/S42/S43 identities and cannot repeat head, terminal-intent, event, outbox, reservation, closure, or operation effects.
  - Make live fenced commands prove the exact locked intent's current owner, token, live lease, and status; make AcquireLease prove the exact prior compare-and-swap basis and ReapIntent prove an expired/deadline basis.
  - Bind T6 inserted references to exact locked or same-command rows, persist the locked prior S38 head as S39 parent metadata, materialize the verified S49 closure, link supersession through the prior bundle prescription/authorization, and update S01.execution_basis_event_id to the same-transaction S03 event.
  - Require S42 issuance reason and a validity certificate containing authorization epoch, method version, exact dependency identities, and a deterministic closure digest bound to the acquired registry revision.
  - Commit PermitDispatch's S31 transition with S02/S03/S04, require its ref_s27_id and dispatch fence to match the verified live intent/fence, and return executable permission only to the first RESERVED-to-DISPATCH_INTENT winner; every replay is non-sendable.
  - Keep OutboxDispatcher limited to an isolated S04 claim and require business work to enter later as a new idempotent command after row-lock release.
known_limitations:
  - These are transaction and repository guard interfaces; downstream command tasks still own their domain-specific guard predicates and mutations within the declared capabilities.
  - The tests use isolated synthetic subjects, policies, artifacts, and command outcomes and claim no product requirement PASS or production auto-activation readiness.
