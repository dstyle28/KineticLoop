decisions:
  - Give every public command surface exactly one repository owner; T6CommitCoordinator is the single atomic database owner for the PrescriptionCommitService and AuthorizationService CommitBundle boundary.
  - Expose no raw SQL, cursor, or connection to callbacks; structured insert/update operations generate identifiers from the owner's logical-table capability and quote columns mechanically.
  - Bind every non-global structured insert/update to the authenticated transaction subject and reject subject reassignment, including preparation and factset-build capabilities.
  - Reject repeated acquisitions of a lock stage and require strictly increasing remaining-aggregate table ranks, so stable order holds across the complete transaction rather than only within one method call.
  - Acquire declared remaining aggregate locks only after the S02 receipt lock on first execution; durable replays return before those work locks and cannot repeat mutations.
  - Treat frozen T1 raw source receipt admission as the sole subject-command exception to S01 while still forbidding any later reverse acquisition of S01.
  - Reuse the merged command-specific SafetyRegistry routines so T3, T6, and T7 obtain S51 then S01 and revalidate exact artifact closure before mutation.
  - Bind factset-build capability to command identity; BeginBuild and CompleteFactset receive S15 only, while WriteCandidate receives S15 and S16.
  - Store the complete successful outcome in S02 so ACK-loss replay returns the same S39/S40/S41/S42/S43 identities and cannot repeat head, terminal-intent, event, outbox, reservation, or operation effects.
  - Commit PermitDispatch's S31 transition with S02/S03/S04 and return executable permission only to the first RESERVED-to-DISPATCH_INTENT winner; every replay is non-sendable.
  - Keep OutboxDispatcher limited to an isolated S04 claim and require business work to enter later as a new idempotent command after row-lock release.
known_limitations:
  - These are transaction and repository guard interfaces; downstream command tasks still own their domain-specific guard predicates and mutations within the declared capabilities.
  - The tests use isolated synthetic subjects, policies, artifacts, and command outcomes and claim no product requirement PASS or production auto-activation readiness.
