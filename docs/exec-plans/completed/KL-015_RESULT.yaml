summary: >-
  Added the shared repository transaction harness for all 39 public command
  surfaces. Each command has one repository owner, owns one outer PostgreSQL
  transaction, and receives only structured, owner-scoped mutation operations after
  its required guards. The interface enforces the frozen S51-to-S01-to-S30-to-S27-
  to-S31-to-S38-to-S44-to-S02-to-aggregate order, stable multi-key ordering across
  the whole transaction, exact artifact identity, current lease/fence authority,
  atomic S02/S03/S04 outcomes, non-sendable dispatch replay, ACK-loss replay, and an
  S01-free outbox dispatcher. Preparation and command-specific factset-build
  capabilities cannot express coordination access or out-of-scope writes. Real
  PostgreSQL failure and interleaving tests cover T1-T8 commit/rollback atomicity,
  stale fences, opposing key order, first dispatch winner with atomic event/outbox,
  and complete durable T6 issuance and supersession replay.
