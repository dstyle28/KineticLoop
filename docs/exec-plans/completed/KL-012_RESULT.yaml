summary: >-
  Added a complete deny-by-default S01-S51 permission matrix, stable per-relation
  command-owner roles, generated PostgreSQL grants, immutable-history triggers,
  guarded owned transitions, and a real isolated-PostgreSQL fixture. Ordinary
  application SQL is read-only, immutable command owners are append-only, no
  runtime role receives DELETE, and build/mutable UPDATE remains owner-scoped and
  subject to lifecycle guards.
