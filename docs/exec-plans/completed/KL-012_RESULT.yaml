decisions:
  - Ordinary application and audit roles are read-only; non-login command principals own narrow SECURITY DEFINER entrypoints rather than runtime DML connections.
  - Shared atomic writers use one role across their frozen relation set, while split owners such as S04 origin INSERT and dispatcher UPDATE receive operation-specific grants.
  - ACL reconciliation revokes every concrete runtime/writer role before granting each exact cell, preventing stale cross-owner privileges.
  - Command-specific metadata binds identity, orchestration and writer principals, touched relation operations, atomic group, ordered locks, and path guards; relation guard unions are non-authoritative inventory only.
  - S15 build uses only the build lock while seal uses user then build; S44 external fact acceptance remains registry-independent while START/RESUME uses registry-shared then user then execution.
  - The application executes an actual SECURITY DEFINER append routine owned by a NOLOGIN writer and cannot assume that role or issue equivalent direct DML.
  - I-class command owners receive append-only INSERT, while M/B/B-to-I owners receive guarded UPDATE; no runtime cell receives DELETE.
  - S15 and S16 remain explicitly build-to-immutable so downstream DDL must close their write gates at READY or parent READY/SEALED.
  - Privileged migration ownership and privacy erasure remain separate reviewed capabilities and are never runtime convenience bypasses.
known_limitations:
  - KL-013 owns full baseline PostgreSQL DDL and installation of these grants and lifecycle triggers on every physical table and typed child relation.
  - This task proves permission and transition enforcement on a minimal real-PostgreSQL fixture; it does not claim product requirement PASS.
follow_up_tasks:
  - KL-013 must materialize the matrix across the complete physical schema without weakening unique-writer or immutable-history guards.
