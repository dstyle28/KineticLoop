summary: >-
  Added a complete deny-by-default S01-S51 permission matrix with command-scoped
  non-login writer roles, operation-specific split ownership, full cross-role ACL
  reconciliation, command-specific transaction/lock metadata, immutable-history
  triggers, and a real SECURITY DEFINER/NOLOGIN PostgreSQL command boundary.
  Ordinary application SQL is read-only, immutable writers are append-only, no
  runtime role receives DELETE, and divergent S15/S44 paths retain their distinct
  frozen lock and authorization guards.
