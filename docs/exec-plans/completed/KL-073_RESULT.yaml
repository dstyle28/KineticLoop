decisions:
  - Preserve the fixed quota-window basis because it is a deterministic key, not lease/deadline truth.
  - Read PostgreSQL clock_timestamp() immediately before each live lease/deadline operation and carry the exact value through its guard and mutation.
  - Express stale and expired setup relative to PostgreSQL time so negative assertions remain stable across calendar dates and long sessions.
  - Keep all production transaction, fencing, authorization, and persistence code byte-unchanged.
