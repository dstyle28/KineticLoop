summary: >-
  Replaced the decaying module-level wall-clock basis in the KL-015 PostgreSQL
  transaction-interface tests with fresh database-clock-relative timestamps at
  each lease or deadline setup/operation. Exact lease expiry and deadline values
  are carried from the database read into both guards and mutations. Deliberately
  expired leases, elapsed deadlines, stale owners, and stale fences remain negative.
  Fixed quota-window keys and non-comparative completion records remain explicitly
  separate from live lease/deadline truth. No production code, migration, frozen
  authority, lease/fence predicate, transaction boundary, or authorization meaning
  changed.
