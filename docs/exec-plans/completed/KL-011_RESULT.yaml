decisions:
  - Keep the KL-011 child inventory closed to the packet deliverable of strength, cardio, health, and nutrition relations.
  - Keep BODY_MEASUREMENT and OUTCOME_OBSERVATION as valid frozen S14 union members without inventing unauthorized physical child shapes.
  - Model zero as an ACTUAL typed value and model UNKNOWN, NOT_MEASURED, NOT_APPLICABLE, and PARSE_FAILED as explicit valueless states.
  - Require field provenance to bind S09 evidence revision, S10 assertion, S13 admission decision, and a stable source locator.
  - Define each child field with a closed scalar type, allowed value states, value nullability, unit policy, exactly-one cardinality, and mandatory provenance.
  - Use subject/fact-revision/child-identity for row uniqueness and subject/stable-fact/child-identity for correction continuity across appended revisions.
  - Preserve AcceptFactRevision as the sole writer and T2-IN as the atomic boundary for the S14 root and child rows.
