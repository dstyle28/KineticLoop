decisions:
  - Treat frozen logical relation numbers as identities, never as DDL sequence numbers.
  - Create mutable authority roots before their dependents and add forward authority pointers only after all target relations exist.
  - Keep self-references local to their owning relation and model cross-relation dependencies as validated logical IDs.
  - Require downstream DDL to materialize polymorphic reference sets as closed typed foreign keys or normalized child edges.
known_limitations:
  - This task defines migration topology only; KL-013 owns concrete PostgreSQL DDL, constraints, indexes, and migration execution.
