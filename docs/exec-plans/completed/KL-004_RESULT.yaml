decisions:
  - Preserve every DB section 3 and section 11 error wire identity as a unique ErrorCode member without aliases or normalization.
  - Model receipt uniqueness with exactly one canonical subject ID or explicit scope, so global management commands do not manufacture a subject.
  - Keep status and result/error/time fields structurally strict but semantically opaque; no receipt lifecycle or field-correlation rules are introduced.
  - Derive mismatch behavior from an explicit command binding, preserving IDEMPOTENCY_CONFLICT only for BeginBuild, WriteCandidate, and RevokeArtifact and the generic frozen spelling otherwise.
  - Return the exact stored ReceiptResult object for same-hash replay and expose no admission, authorization, execution, or provider-send permission.
known_limitations:
  - This pure base contract does not implement S02 persistence, PostgreSQL uniqueness, transaction atomicity, receipt retention, ACK-loss handling, lock acquisition, or concurrency validation.
  - Receipt status lifecycle and valid status/result/error combinations remain intentionally undefined pending later authority.
follow_up_tasks:
  - The later S02/CommandGateway implementation must enforce the frozen lock order, same-transaction receipt/result mutation, persistence, and real PostgreSQL concurrency evidence.
