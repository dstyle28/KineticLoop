decisions:
- Publish HEVY and APPLE_HEALTHKIT as required launch integrations; MANUAL_CHAT remains
  required fallback.
- Represent HEALTHKIT_NUTRITION as an optional stream of canonical APPLE_HEALTHKIT
  rather than a new provider.
- Reject caller promotion of optional entries even when the version is changed; approved
  policy/ADR requires an explicit catalog change.
- Keep source policy separate from runtime connection status, evidence coverage, frozen
  SafetyRegistry and adapter release readiness.
- Keep Oura raw and derived AI exposure denied with explicit INT-06 prerequisite metadata;
  no caller flag or membership grants approval.
- No invariants, transactions, logical tables, frozen authority or shared provider
  contracts are modified.
known_limitations:
- Descriptive policy only; actual adapters, ingress/admission, cross-source association,
  runtime coverage and AI-context enforcement remain downstream.
- No adapter LAUNCH_READY, M9A completion, product requirement PASS, E2E degradation
  evidence, release-gate PASS or production activation is claimed.
- The trusted in-process registry is not a sandbox against arbitrary code executing
  low-level object mutation; provider observations have no registry input or registration
  API.
- Exact HealthKit iOS sample types and source-specific transport configuration remain
  downstream decisions.
follow_up_tasks:
- Complete actual adapters under their unchanged KL-051/KL-052 prerequisites.
- INT-06 must approve any future Oura AI exposure via its separate compliance/field
  policy gate.
- Prove provider-loss degradation and adapter launch release obligations in downstream
  E2E gates.
