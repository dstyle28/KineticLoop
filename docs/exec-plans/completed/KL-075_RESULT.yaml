decisions:
- Keep both owners INTERNAL_ONLY_OPERATIONS and PREPARATION descriptors. Generic execute_command/execute_preparation
  reject them; only typed authenticated progress persistence grants one exact server-derived
  write. Public 39-owner descriptor/column fingerprint equals protected baseline.
- AcquireLease owns current S27 fence/lease only. AdvanceAttempt explicitly verifies
  CREATED to LEASED and records the actual fence before BUILDING_CONTEXT and frozen
  forward stages. Current guards reread trusted time after S01/intent/receipt/attempt
  locks.
- Capture full mandatory context outside coordination from exact immutable manifest/request/program/policy
  inputs. Bind registered policy-selected RUNTIME builder version/hash, audit cutoff
  and bounded UTF8 byte accounting to the complete immutable context hash. Rebuilds
  append S26 sequence; AdvanceAttempt alone binds S29 snapshot pointer.
- Every stage preserves earlier source IDs/hashes. FITNESS/Demand/Nutrition/resolution/validation
  binding mutants with self-consistent content hashes deny. Validation also binds
  current execution basis and explicit semantic/envelope PASS; progression never issues
  authorization.
- Exact equality evidence is PU over the actual predicates. Actual PostgreSQL before/after
  and four bounded observed lock-wait crossings are separate DC evidence; no caller
  clock or production time seam.
- Only own exact HEAD-first7/resolved-root SHA256-first12 progress namespace is constructed,
  bootstrapped, reset, seeded and destroyed. Revalidate nested lifecycle and explicit
  current_database; cleanup inventories containers/volumes/networks empty. No foreign
  legacy fixture lifecycle invoked.
known_limitations:
