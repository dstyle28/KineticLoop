- Later-stage immutable fixtures are declared INPUT_ONLY guard instrumentation and
  not F/D/N completeness evidence. KL076 remains responsible for composed preparation.
  Product, WF, E2E, release and production autoactivation obligations are not claimed
  PASS.
- Broader legacy DB regressions run only in unchanged hosted PostgreSQL CI on fresh
  ubuntu-latest. Required independent reviews, final-head CI and protected selected-task
  merge gate are merge conditions, not facts inferred from local task checks.
- The immutable reviewed result retains integration_status UNMERGED and merge_commit
