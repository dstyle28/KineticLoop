decisions:
- Verified actual prerequisite result/integration PASS and merge ancestry at the protected HG053 base, current migration
  head e8c2f1a6b904, M3 minimal isolated TEST closure and reserved exclusive transaction_interfaces/user_coordination/planning_ledger.
  Admission evidence records exact identities and revisions.
- Typed TEST ingress checks exact registered subject/policy/environment/principal before discovery and replay and
  again under S01 against active policy. A private prepared token derives only exact S27/S29 closure; the original
  generic legacy ReapIntent completion branch stays unchanged and provides no new runtime authority.
- Committed discovery releases its read transaction before S01, then first-use reaping locks S27, sorted applicable
  S31, S02 and S29. Exact current facts and post-lock database time derive DEADLINE_EXCEEDED/LEASE_LOST or policy-authorized
  CANCELLED/CANCELLED. Only current unowned ADMITTED/PENDING, NULL owner, fence0, CREATED and elapsed deadline accepts
  the nullable basis.
- Complete S27/S29, receipt, event and outbox mutation commits atomically. Historical authenticated same-key/hash
  replay stays non-executable; stale facts, altered payload and prepared-value tampering deny with complete relation
  history unchanged.
- Independent accounting scans use actual MarkUnknown in separate owner transactions. Interrupted cleanup preserves
  outstanding occupation; queued actual PermitDispatch wins against witnessed cancellation, unknown cannot resend/refund,
  and reliable late settlement changes accounting only while actual stale T6 denial preserves terminal planning
  authority.
- Distinct spawned processes consume a real bounded ordinary queue, heartbeat outside coordination, saturate its
  sole remaining queue slot, and preserve independent admission/reaper capacity after worker termination. Actual
  owner preflight/reentry waits are observed on idle sessions, and deterministic S01 queues are witnessed through
  pg_locks and pg_blocking_pids.
- Own DatabaseLifecycle gates constructor and every nested reset/bootstrap/seed reset/destroy on full tested SHA
  and resolved-root SHA256. Names are kineticloop_kl036_6a3f10e_17e8ad78fba3 and kineticloop-kl036-6a3f10e-17e8ad78fba3.
  Exact inherited lifecycle command shapes reject appended project/file overrides and foreign readiness/SQL targets
  before any runner call. Before/after inventories prove owned children/resources removed and foreign databases/projects/containers/volumes/networks
  unchanged.
- Every final selector and suite has positive exact collection/execution/JUnit identity/count agreement and passing
  setup/call/teardown, with lossless command/SHA-bound artifacts. A new collection record shares an existing own-task
  byte-identical content-addressed payload; each execution retains its own provenance and no committed evidence
  is overwritten.
- Previous failed and superseded trial records remain distinct. All sixteen checks at 0e330e4 exited PASS but were
  superseded after an additional pure-unit probe exposed nested foreign Compose argv reaching a mock runner; no
  physical Docker I/O occurred. The own fixture now pins the Compose file and exact lifecycle command shapes, with
  negative rejection before the runner and positive migrated bootstrap/cleanup. The 55bde455 full-run launcher was
  interrupted for a deterministic committed-heartbeat observation correction, retained as FAIL with remaining checks
  NOT_RUN and no harness eligibility. The f478248 harness passed 1492 cases but its launcher stopped on an exact
  tracked synthetic password-mutation node ID; the guard recognizes only that identifier and retains original bytes.
  Final eligibility uses only this result tested revision and complete sixteen-check run.
known_limitations:
- Runtime is bounded isolated TEST instrumentation, with a privileged internal service session separate from the
  authenticated nonwriter client principal. It does not prove restricted-login ACL containment or production readiness;
  there are no migration/grant/public-command/enum/authorization/Evidence Admission/lock-order/T1-T8 changes.
- Coherent immutable S26/S34-S37 and COMMIT_READY preparation inputs are declared upstream TEST seeds. Actual T3/T4/T6
  owners produce publication, admission/lease and success; no head/bundle/authorization/reaper success/receipt winner
  is seeded. This is task DC/WF evidence, not full planner/model/provider workflow or product evidence.
- An early failed trial exposed local-only setup DSNs in pytest diagnostics. Original unmodified logs/captures are
  quarantined in private local scratch with hashes in failed-ebe7ade-sanitized/FAILURE_RECORD.json; Git has explicitly
  labeled sanitized diagnostics, which are not lossless original eligibility evidence. Redacted connection representations
  and the hard credential guard protect all final eligible captures.
- Requirements covered stays empty. Product W/I, M4, release and full planning obligations remain NOT_RUN; production_auto_activation=false
  and shadow_executable=false remain unchanged. Task PASS, review PASS and MERGED are separate facts.
- The coordinator retains final installed-App admission, unchanged trusted full-DB regression/controller gate and
  merge ownership. No installation or App/full-DB gate is run or published here. Hosted final-head ordinary CI and
  independent review evidence are separate merge conditions.
- This reviewed result remains UNMERGED with merge_commit null; a later integration record must bind the actual
  normal merge without mutating the reviewed result.
