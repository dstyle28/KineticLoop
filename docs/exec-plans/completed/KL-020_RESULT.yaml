summary: >-
  Added residual real-PostgreSQL acceptance coverage for the merged KL-015
  transaction harness without changing production code. Database-observed
  interleavings prove representative T2 through T7 commands serialize on the
  subject S01 row after any required S51 gate, reread the committed epoch and
  either proceed from that basis or fail closed, while a second subject remains
  independent. Concurrent same-key/same-hash calls persist one S02/S03/S04 and
  return one byte-equivalent replay; different hashes persist one outcome and
  reject the blocked loser after the winner commits. Historical replay remains
  available after current artifact and lease/fence guards fail, but PermitDispatch
  replay is non-sendable and T7 replay is non-executable. Frozen complete and
  multi-key lock order tests remain green.
