decisions:
  - Reuse the merged RepositoryTransaction command owners and idempotent outcome path; add no test-side replica of production transaction logic.
  - Observe blocking through PostgreSQL pg_blocking_pids and release contenders with bounded threading events; use no timing sleep as a correctness oracle.
  - Exercise boundary-specific post-lock guard rejection for each representative T2-T7 owner and assert complete rollback of every attempted S02/S03/S04 identity.
  - Prove historical replay excludes aggregate mutation guards by completing T6 replay while S27, S31, S38 and S44 rows are held by another transaction.
  - Keep the task-only explicit PostgreSQL and Compose namespaces opt-in through KL-020 environment variables so normal suite runs retain worktree-derived isolation.
  - Preserve product requirement status separately; this acceptance-only task claims no requirement PASS.
known_limitations:
  - The tests exercise isolated synthetic subjects, commands, receipts and current-guard invalidation; they do not enable production auto-activation or make real-data shadow executable.
  - Task PASS does not imply product requirement PASS, independent review PASS, CI PASS or MERGED state.
