summary: >-
  Added residual real-PostgreSQL acceptance coverage for the merged KL-015
  transaction harness without changing production code. Database-observed
  interleavings prove representative T2 through T7 commands serialize on the
  subject S01 row after any required S51 gate, reread the committed epoch and
  fail closed through their boundary-specific post-lock guards with no lost S01
  update or residual S02/S03/S04 outcome, while a second subject remains independent.
  Concurrent same-key/same-hash calls persist one S02/S03/S04 and
  return one byte-equivalent replay; different hashes persist one outcome and
  reject the blocked loser after the winner commits. Historical replay remains
  available after current artifact and lease/fence guards fail and while S27/S31/
  S38/S44 aggregate rows are held, but PermitDispatch replay is non-sendable and T7
  replay is non-executable. Frozen complete and multi-key lock order tests remain green.
