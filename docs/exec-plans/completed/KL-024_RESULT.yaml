decisions:
- Use versioned deterministic structured normalization, separating subject/date/purpose partition from
  semantic fingerprint and calendar scope; same fingerprint/current Manifest/epoch/frontier joins without
  S28/S29 or quota debit.
- Resolve immutable active admission policy under S01; new roots atomically debit policy-bound hourly/day
  S30 quotas, retain nonnegative root limits/reserved/settled categories, and start ADMITTED with original
  server deadline.
- Bounded T4 revision appends exact S28/S29, marks only the old current attempt STALE, and updates only
  current pointers; root limits/counters/deadline/lease/fence remain unchanged. Copies of the prepared
  basis cannot mutate guard authority.
- Retain frozen lease lock order and S27-only lease capabilities; acquire uses monotonic owner/token CAS,
  renewal rereads after locks and extends only a live lease within deadline. New typed commands reject
  terminal/unknown attempt states; the shared fence guard retains merged nonterminal compatibility while
  rejecting frozen terminal attempts.
- New service intents use frozen ADMITTED; existing PENDING remains explicit ADMITTED compatibility in
  the active unique index and acquisition guard. Intent terminal reasons remain distinct; success remains
  T6-owned.
- Scope receipt and event identities by trusted actor, command kind and client key. Successful historical
  replay returns original identities with replayed=true without refreshing current worker authority; an
  under-S01 recheck closes preflight races. Independent replay-marker finding repaired with preflight
  and under-S01 replay tests for admission/acquire/renew after revision and cancellation.
- 'Independent review quota finding repaired: completion requires exact distinct prepared S30 identities
  and exactly one effect per bucket. Migrated PostgreSQL negative duplicate-one/omit-other callback test
  proves complete rollback.'
- HG032 PR63 merged at abc5af6 authorizes only DATE 2026-09-27 to 2026-09-28 inside the INTENT local_date
  update in test_reauthorize_requires_atomic_intent_success. Applied exactly that byte change and verified
  all other bytes against protected master, preserving head-day GuardRequired, restoration, all other
  cases and active-partition uniqueness.
- HG033 PR64 merged at8ebeab3 authorizes only the two expected-version expressions REVISION -> _MIGRATIONS.HEAD_REVISION
  inside test_populated_downgrade_fails_before_guard_or_acl_changes. Applied exactly those expressions,
  preserving every other byte and all exception/trigger/lookup/ACL/namespace/binding/retained-data oracles;
  HG032 date repair remains exact. Historical migration identities and frozen guards remain unchanged.
- Preserve all prior raw checks, unapplied historical proposals, candidate-only proof labels and byte-identical
  BLOCKED snapshots. Current task PASS selects only the new exact/full-CI checks on the post-governance
  tested SHA; previous review records cannot approve this revision. Inventory includes only committed
  task paths and the explicit new selected evidence files.
known_limitations:
- Task PASS covers local implementation evidence only. No W04-W06 product/release PASS, model loop, call
  ledger, dispatch, downstream attempt advancement, full watchdog/reaper, authorization implementation
  or production activation is claimed. Expired active/terminal-attempt recovery remains downstream.
- Ingress authentication supplies trusted subject/actor binding and owner connection. Runtime system/model
  capacity admission is represented by the versioned policy boundary and downstream enforcement; no provider/model
  network call occurs inside coordination.
- Historical BLOCKED/CHANGES_REQUIRED records and candidate probes retain their original meanings. They
  are not current CI, review or release approval. Both governance-authorized fixture compatibility repairs
  are now exercised by actual full regression suites.
- Result records UNMERGED before independent review; actual Git integration remains a separate fact and
  must not mutate the reviewed result.
follow_up_tasks:
- Complete fresh GENERAL, PROTOCOL and DB_CONCURRENCY reviews against this implementation/result revision.
  Fix substantive findings and retest/rereview if needed; only the task-scoped review-record-only suffix
  may follow without rereview.
- Merge existing PR62 normally only after required reviews and all CI/merge gates PASS; ff-only synchronize
  clean master, clean only verified merged task resources and archive the completed task.
- Downstream KL025 owns call ledger/dispatch; later tasks own model loop, attempt advancement, recovery/reaper
  and full W04-W06 release evidence. Record post-merge integration separately without changing this result.
