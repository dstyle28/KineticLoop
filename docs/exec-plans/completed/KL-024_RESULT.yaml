decisions:
- Use versioned deterministic structured normalization, separating subject/date/purpose partition from
  semantic fingerprint and calendar scope; same fingerprint/current Manifest/epoch/frontier joins without
  S28/S29 or quota debit.
- Resolve immutable active admission policy under S01; new roots atomically debit policy-bound hourly/day
  S30 quotas, retain nonnegative root limits/reserved/settled categories, and start ADMITTED with original
  server deadline.
- Bounded T4 revision appends exact S28/S29, marks only the old current attempt STALE, and updates only
  current pointers; root limits/counters/deadline/lease/fence remain unchanged. Copies of the prepared
  basis cannot mutate guard authority.
- Retain frozen lease lock order and S27-only lease capabilities; acquire uses monotonic owner/token CAS,
  renewal rereads after locks and extends only a live lease within deadline. New typed commands reject
  terminal/unknown attempt states; the shared fence guard retains merged nonterminal compatibility while
  rejecting frozen terminal attempts.
- New service intents use frozen ADMITTED; existing PENDING remains explicit ADMITTED compatibility in
  the active unique index and acquisition guard. Intent terminal reasons remain distinct; success remains
  T6-owned.
- Scope receipt and event identities by trusted actor, command kind and client key. Successful historical
  replay returns original identities with replayed=true without refreshing current worker authority; an
  under-S01 recheck closes preflight races. Independent replay-marker finding repaired with preflight
  and under-S01 replay tests for admission/acquire/renew after revision and cancellation.
- 'Independent review quota finding repaired: completion requires exact distinct prepared S30 identities
  and exactly one effect per bucket. Migrated PostgreSQL negative duplicate-one/omit-other callback test
  proves complete rollback.'
- HG032 PR63 merged at abc5af6 authorizes only DATE 2026-09-27 to 2026-09-28 inside the INTENT local_date
  update in test_reauthorize_requires_atomic_intent_success. Applied exactly that byte change and verified
  all other bytes against protected master, preserving head-day GuardRequired, restoration, all other
  cases and active-partition uniqueness.
- Retain old BLOCKED result byte-identically at docs/exec-plans/evidence/KL-024/blocked-result-885d038.yaml,
  old raw evidence and historical review revisions. Select only fresh post-integration exact checks for
  current task PASS; fresh required reviews must bind the new result revision. The prior date-fixture
  blocker is repaired under HG032; the newly discovered subject-scope CI blocker is separate.
