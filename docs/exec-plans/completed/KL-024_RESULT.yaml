- tests/db/test_subject_scope.py remains byte-identical to protected master and is outside KL024 scope.
  The unapplied proposal is docs/exec-plans/evidence/KL-024/proposed-subject-scope-head-rescope.patch.
  Candidate-only in-memory probe models those two expectations without editing the excluded file; it is
  not actual CI or task PASS. Governance must authorize the repair before normal implementation/retest/review/merge.
- Thirteen passing required local task checks cover PU/DC implementation only. No W04-W06 product/release
  PASS, model loop, call ledger, dispatch, downstream attempt advancement, full watchdog/reaper, authorization
  implementation or production activation is claimed. Expired active/terminal-attempt recovery remains
  downstream.
- Ingress authentication supplies trusted subject/actor binding and owner connection; runtime system/model
  capacity admission is represented by the versioned policy boundary and downstream enforcement, without
  provider/model network calls inside coordination.
- Historical BLOCKED results and CHANGES_REQUIRED reviews remain historical facts. The authorized fixture
  repair closes their scope blocker only after these new checks and fresh SHA-bound reviews; previous
  review evidence is not reused as approval.
- Result records UNMERGED before independent review. Actual integration is recorded separately without
