summary: >-
  Added only the residual real-PostgreSQL acceptance coverage required for the
  already-merged T2-GLOBAL SafetyRegistry owner. Database-clock-relative cases
  prove commit is the revoke linearization point for backdated and future
  effective_at metadata, while an injected post-S50 failure rolls back S50,
  S51, management receipt, audit and outbox state and leaves admission eligible.
  PostgreSQL-observed bounded interleavings prove both shared-first and
  revoke-first commit orders. Locked rows for three isolated subjects plus exact
  relation snapshots prove RevokeArtifact has no S01 or per-user fanout
  dependency. Existing authority, idempotency and unknown-commit cases remain
  green. A committed revoke denies all six migrated T3/T6/T7 current admission
  paths while immutable authorization, execution-binding, receipt, event and
  outbox history stays byte-equivalent and historical START replay is explicitly
  non-executable.
