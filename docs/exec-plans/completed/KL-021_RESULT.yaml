decisions:
  - Reuse the merged public RevokeArtifact persistence owner and migrated command routine; add no test-side production mechanism, source change or migration.
  - Derive backdated and future effective_at fixtures from PostgreSQL clock_timestamp and treat effective_at only as immutable audit metadata.
  - Observe blocking with pg_blocking_pids and bounded thread/barrier coordination; use no sleep as a correctness oracle in the added acceptance cases.
  - Use the isolated Compose project kineticloop-kl021-ec264bb and database kineticloop_kl021_ec264bb, with module teardown removing its containers, network and volume.
  - Preserve product requirement status separately; this acceptance-only task claims no requirement PASS.
known_limitations:
  - The tests use isolated synthetic subjects and migrated PostgreSQL roles; they do not enable production auto-activation or make real-data shadow executable.
  - Task PASS does not imply product requirement PASS, independent review PASS, CI PASS or MERGED state.
