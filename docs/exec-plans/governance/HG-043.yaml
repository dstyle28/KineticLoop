known_limitations:
- Governance validator repair only. No task, product requirement, DB, release or production PASS is
  inferred.
- Five candidates replayed from protected Git ancestry in ephemeral fixtures; no official integration
  records written. HG042 owns later bookkeeping.
- Review-created logs are reviewer bookkeeping, never pre-review task acceptance evidence.
- Prior SHA-bound CHANGES_REQUIRED reviews and reproductions are preserved; the absence boundary is
  repaired and requires fresh reviews at the final revision.
- Delayed review with unrelated intervening commits retains ordinary reviewed evidence support but cannot
  use the new strict suffix exception.
- No database runtime is run locally for this validator repair; independent specialist audit and all
  final applicable hosted PostgreSQL CI are required before ordinary merge.
- Fresh GENERAL/PROTOCOL/DB_CONCURRENCY review binds final governance/evidence head. Only own HG043
  review suffix follows.
