known_limitations:
- Product, M3, release and full database/controller checks remain NOT_RUN here. Root owns separately reviewed installation,
  exact pins/admission and final stable-head App full DB window.
- GENERAL and SECURITY_DATA_BOUNDARY independent reviews bind the implementation/governance/evidence revision. Only
  own REVIEW_RECORD_ONLY suffix may follow.
- Historical HG049 failure and separate unchanged-controller caffeinate rerun remain untouched and supply no corrective
  PASS. No configuration/signing/admission edit, manual publication or one-time exception.
- Clock rollback detection is conservative at observations, not proof against arbitrary unobserved clock corruption.
  Installation tokens remain memory-only.
- POST/PATCH errors terminate without replay; a success body rejected with 401 is not published. A separate controller
  failure PATCH may proactively renew after a failed GET; it never turns that run into success.
- Failed precommit probes and both failed full-harness executions are preserved losslessly. Initial wrapper rejected
  implementer-created untracked evidence despite 1405 pytest passes. Clean retry failed a temporary Git fixture
  setup with 1404 passes; isolated probe passed. Only final complete clean run supplies PASS. Other checks remain
  valid at unchanged tested SHA.
