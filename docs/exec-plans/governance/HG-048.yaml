- Only candidate pinned validator HG048 allowlist changes; no installed controller or settings change. Reviewed
  pin/decoder installation and exact admission remain an administrator handoff.
- Compact raw storage reuses the existing PR91 codec via the exact blob/hash in CODEC_SOURCE.json; this does not
  assert installed format support.
