known_limitations:
- Governance checks PASS only; all prospective KL026/027/075/076/077 implementation checks and product/release
  obligations start NOT_RUN; M3 is not closed.
- I04@DC and I04@WF are separate; KL026 has no process-WF implementation or production fix permission.
  Any test-discovered production bug requires a separately bounded task and fresh review.
- RecordSnapshot/AdvanceAttempt remain internal, absent from the 39 public commands. No upstream stage/preparation/full
  execution capability is implemented in this governance PR.
- Existing generic ApplyControl/AcceptFactRevision and projection/BuildManifest recipes are ratified
  only as exact trusted restricted TEST owner instrumentation, not public typed ingress/authentication
  implementation.
- 'I03 uses two existing owner transactions: terminal root first, guarded RESERVED cleanup afterward.
  No speculative CancelIntent S32 grant or atomic root-plus-ledger claim; DISPATCH_INTENT occupation
  persists.'
- KL077 ordinary PAUSE is a bounded internal TEST lifecycle contraction with no execution grant; protective
  pause/STOP/hold remains frozen T2. Positive RESUME and authority denials require owner-produced valid
  lifecycle states.
- Exact equality is deterministic PU predicate evidence. Actual real-PG guards provide fresh clock_timestamp
  without a controllable equality seam; DC proves before/after and expiry crossed during observed lock
  waits. No PU-to-DC or DC-to-WF PASS substitution.
- Deterministic TEST policy predicates and complete F/D/N fixture provenance do not establish clinical,
  model, production quality, rollout, or provider policy. Missing real-data/model/evaluation obligations
  remain unclaimed.
- No foreign local DB fixtures or KL074-only workflow reuse. Own real-PG suites require exact SHA/resolved-root
  DB/Compose validation and nested lifecycle audit; legacy full DB CI remains unchanged on fresh hosted
  VM.
- Fresh independent GENERAL/PROTOCOL/DB_CONCURRENCY reviews bind the final governance/evidence SHA;
  after review only HG038 review-record paths may change. All normal hosted gates must pass before normal
  merge.
