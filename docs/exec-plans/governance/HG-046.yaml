known_limitations:
- Initial independent reviews rejected an extension-based compact-envelope bypass. Those findings and exact reproductions
  are retained in own r1 review child directories. The corrected implementation recognizes reserved storage content
  independent of extension, checks JSON raw_utf8 independent of names, and binds ancillary M3 command metadata;
  fresh reviews are required for this revision.
- Storage/governance only. No runtime, migration, frozen baseline, task packet, backlog, requirement status, production
  activation or executable shadow changes. Related product/release requirements remain NOT_RUN.
- Historical evidence/reviews are unchanged. This is a prospective policy, not a historical archive or deletion
  migration.
- All required local checks bind the exact tested implementation SHA. Raw output is retained once in deterministic
  gzip with length/hash and command/exit/count/timestamp metadata; the same bound Git revision supplies both envelope
  and payload.
- The host has no uv executable on PATH. Stable kl engineering entrypoints ran through the existing pinned Python
  3.12 development environment with an absolute PYTHONPATH. The initial relative-PYTHONPATH development unit failure
  was an environment issue and is superseded by the selected final run.
- Hosted applicable CI remains mandatory and is not waived. GitHub billing/spending-limit failures reported by the
  coordinator may prevent jobs from starting; exact final PR status must be inspected before merge.
- Fresh independent GENERAL, PROTOCOL and SECURITY_DATA_BOUNDARY reviews must bind the committed governance/evidence
  revision. Only the own REVIEW_RECORD_ONLY suffix may follow; stop before merge for coordinator serialization and
  protected-base refresh.
- Capture metadata does not certify truth or create PASS. M3 still requires actual raw-log counts, JUnit cases,
  exact selectors and collection correspondence; summaries alone never substitute for proof.
