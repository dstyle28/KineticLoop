decisions:
- Entry audit verified indexed authorities, merged prerequisite PASS results/integrations and specialist
  reviews, M2 closure and actual KL025 API/fixture bytes before the first real local reset. Latest
  protected HG036 master was incorporated before final testing.
- Keep publication as separate typed request without authorization_scope; preserve all frozen strict
  wire/role/subject-scope/migration/owner-matrix bytes. Authenticated identity is supplied separately
  and exact TEST subject/policy/environment/principal bindings are reread under S51/S01.
- Reuse existing T3/T6/T7 transaction owners, SafetyRegistry coordination and certificate/current-eligibility
  evaluators. Add only exact first-use S38/S44 and immutable prepared/current-basis accessors/checks
  to transactions.py; no generic insert grants or caller-writable timestamps.
- First head calendar derives from immutable policy timezone and trusted database time, exact real
  intent day, null parent/revision zero then guarded revision one; S01 serializes missing natural
  keys. First session is APP_STARTED and exact immutable START binding, server accepted_at and revision
  one complete atomically.
- Bootstrap only registered upstream TEST S01/policy/program/artifacts/SEALED factset/projections/READY
  candidate. Actual service T3 creates Manifest/projection bindings. Actual KL024 admission/acquire
  creates intent/request/attempt/root budgets/fence/lease. Missing upstream owners require explicitly
  synthetic S26/current COMMIT_READY plus S34-S37 certificate input setup outside target transactions.
- Finite issuance certificate is server-computed with every exact persisted dependency identity/bound,
  complete transitive artifact/TIMELESS approval and minimum verified independently. Caller may only
  shorten. Every historical publish/commit/START replay returns original IDs and executable=false,
  including authority loss/expiry/revocation.
- Preserve transaction fixture complete bytes and mechanically exact planning/ledger namespace transformations.
  Namespace proof runs before real lifecycle; four distinct lowercase tested-SHA/resolved-worktree-derived
  namespaces are inventoried and cleanup uses selected targets only. Broader tests/db runs only unchanged
  hosted ubuntu-latest CI.
- Preserve c739273 ACK-loss setup and 7cdee15 oracle-query failure logs as historical evidence. The
  superseded bf00942 candidate passed all twenty checks; final TEST_ONLY policy scope and exact first-use
  day/session defenses were added before the final full run.
known_limitations:
- No RecordSnapshot/AdvanceAttempt owner, evidence-resolution/semantic-validation engine, full workflow/model
  loop, production activation, executable real-data shadow or provider command authority is implemented.
  Synthetic upstream inputs demonstrate no owner-driven planning progress.
- Trusted ingress must authenticate ExecutionIdentity and supply existing privileged internal owner
  connections. This task compares canonical registered TEST principal metadata; it does not implement
  a new authentication system or grant subject-session privileges.
- I01/I02/I04/I07 and every A03@DC product obligation remain NOT_RUN; passing task PU/DC checks does
  not meet KL027/KL028 or full integration/release trajectories.
- This pre-review result records task PASS/UNMERGED. Independent reviews, unchanged hosted full database/quality
  CI and selected-task merge gate remain separate prerequisites.
follow_up_tasks:
- Complete fresh SHA-bound GENERAL/PROTOCOL/DB_CONCURRENCY reviews; only own review-record-only append
  is allowed afterward. Any substantive repair requires all exact checks and fresh reviews again.
- Require unchanged hosted full database/quality CI and selected-task merge gate PASS, then normal
  merge and ff-only clean master synchronization; preserve unrelated worktrees/resources.
- Missing upstream owners/full workflow and independent product/release acceptance belong to downstream
  packets; do not infer them from this task.
