[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kineticloop"
version = "0.1.0"
description = "KineticLoop development harness"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.16.5",
    "PyYAML==6.0.3",
    "jsonschema==4.25.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.11.9",
    "SQLAlchemy==2.0.43",
]

[project.scripts]
kl = "kineticloop.db.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-xdist==3.8.0", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-jsonschema"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/harness", "tests/db"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tools/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tools/harness", "tools/db", "tests"]
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "kineticloop.*"
disallow_untyped_defs = true
